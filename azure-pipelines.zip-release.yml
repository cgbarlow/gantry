# Zip release pipeline — packages a trimmed, runtime-only copy of gantry
# for locked-down corporate machines: download the zip, unpack, run
# install.cmd (see README "No admin rights on a locked-down corporate
# Windows machine?"). No Git, no Docker registry, no Azure Artifacts feed
# auth required to consume it — just a browser download.
#
# OPERATOR SETUP REQUIRED (YAML alone does not create the pipeline):
# 1. Register this YAML as a new pipeline in Azure DevOps (Pipelines → New
#    pipeline → Existing Azure Pipelines YAML file → select
#    azure-pipelines.zip-release.yml) and enable it.
# 2. Cut a release by pushing a tag matching v* (e.g. `git tag v0.1.0 &&
#    git push origin v0.1.0`) — the trigger below then runs automatically.
#    No service connection or other manual config needed beyond step 1.
# 3. Once the run completes, the zip is attached to it as a pipeline
#    artifact named "gantry-zip" (Pipelines → this run → Artifacts).
#
# What's included: bin/, lib/, web/, definitions/, instances/ (so the
# bundled examples come along), docs/user-guide/ (runtime content — the
# server's own /api/user-guide route in lib/server.js reads
# docs/user-guide/index.md relative to the package root; this is NOT
# contributor/agent documentation, don't fold it back into the exclusion
# below), package.json, package-lock.json, install.cmd, run.cmd,
# README.md, CHANGELOG.md — everything needed to run gantry — plus a generated
# .build-info.json stamping the source commit this build packaged (AB#345:
# this install mode has no .git directory for lib/render.js's Document
# Control commit stamp to read live, so it reads this file instead).
# Deliberately excluded: tests/, reference/ (real-world sample design
# artefacts kept for inspiration, not used by gantry itself — see
# CONTEXT.md if that changes), vendor/anthropic-skills/ (used only to
# verify rendered output during development), the rest of docs/ (adr/,
# agents/, exec-summary.md, qa/, reconciliation/, research/ —
# contributor/agent docs, not read by the running server), node_modules/
# (install.cmd installs these fresh on the target machine via
# `npm install --omit=dev`).

trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - v*
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      version=$(node -p "require('./package.json').version")
      echo "Resolved version: $version"
      echo "##vso[task.setvariable variable=version]$version"
      commit=$(git rev-parse --short HEAD)
      commitDate=$(git log -1 --format=%cs)
      echo "Resolved commit: $commit ($commitDate)"
      echo "##vso[task.setvariable variable=commit]$commit"
      echo "##vso[task.setvariable variable=commitDate]$commitDate"
    displayName: 'Resolve version'

  - script: |
      set -euo pipefail
      stageDir="$(Agent.TempDirectory)/gantry-$(version)"
      mkdir -p "$stageDir"
      cp -r bin lib web definitions instances "$stageDir/"
      mkdir -p "$stageDir/docs"
      cp -r docs/user-guide "$stageDir/docs/"
      # CHANGELOG.md is runtime content for this audience, not contributor docs:
      # a zip install has no .git and its user typically has no Azure DevOps
      # access, so the merge-commit messages and work items that carry this
      # project's release history elsewhere are both unreadable to them. This
      # file is the only way someone holding a zip can answer "what changed, and
      # does this copy have the fix in it?".
      cp package.json package-lock.json install.cmd run.cmd README.md CHANGELOG.md "$stageDir/"
      # AB#345 / WI #312: this package has no .git directory (deliberately — see the
      # header comment above), so lib/render.js's Document Control commit stamp has
      # nothing to `git rev-parse` against at render time. Stamp the source commit
      # this build actually packaged here instead — lib/render.js's
      # localHeadCommitInfo() reads it before ever trying a live `git` lookup.
      printf '{"hash": "%s", "date": "%s"}\n' "$(commit)" "$(commitDate)" > "$stageDir/.build-info.json"
      echo "##vso[task.setvariable variable=stageDir]$stageDir"
    displayName: 'Stage runtime-only files'

  - task: ArchiveFiles@2
    displayName: 'Zip staged files'
    inputs:
      rootFolderOrFile: '$(stageDir)'
      includeRootFolder: true
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/gantry-$(version).zip'
      replaceExistingArchive: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish zip artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/gantry-$(version).zip'
      artifact: 'gantry-zip'
