# All verification (tests, renders) is orchestrated by the ContainerFile
# build stages, which in turn call the npm scripts defined in package.json.
# This keeps local dev, container build, and CI pipeline in sync.
#
# To run the same checks locally:
#   npm run test:unit          # unit & integration tests
#   npm run test:unit:ci       # same, with JUnit XML + LCOV output
#   npm run test:e2e           # Playwright browser tests
#   npm run test:e2e:ci        # same, with JUnit XML output
#   npm run render:examples    # render all example artefacts
#
# Or the full verified container build:
#   podman build --file ContainerFile --tag gantry .

# Branch protection pipeline — triggered only by Azure DevOps build validation policy.
# No CI or PR triggers; the branch policy controls when this runs.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  # Single build: runs tests, renders examples, and produces
  # the runtime image.  Test results are embedded at /ci-results/
  # inside the image and extracted afterward for CI publishing.
  #
  # --no-cache-filter on test stages: these stages always `exit 0`
  # (so results exist even on failure), which means Docker would
  # cache a failing run as "successful".  This flag ensures tests
  # re-run against the current source on every build.  The render
  # stage exits non-zero on failure (natural cache invalidation),
  # so it does not need this flag.
  - script: >
      docker build --file ContainerFile
      --no-cache-filter test
      --no-cache-filter test-e2e
      --tag gantry .
    displayName: 'Build and verify'

  # Extract test results, coverage, and (future) SARIF artifacts
  # from the built image.  Tolerates a missing image (e.g. if the
  # render gate failed the build) so the publish steps can still
  # report "missing results" cleanly.
  - script: |
      id=$(docker create gantry 2>/dev/null) && {
        docker cp "$id":/ci-results $(System.DefaultWorkingDirectory)/ci-results
        docker rm "$id"
      } || echo "##vso[task.logissue type=warning]Could not extract results — image did not build"
    displayName: 'Extract test results'
    condition: always()

  # ── Publish: test results ──────────────────────────────────
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/TEST-unit.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)/ci-results'
      testRunTitle: 'Unit Tests'
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
    condition: always()
    displayName: 'Publish unit test results'

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/TEST-e2e.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)/ci-results'
      testRunTitle: 'E2E Tests (Playwright)'
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
    condition: always()
    displayName: 'Publish E2E test results'

  # ── Publish: code coverage ─────────────────────────────────
  - task: PublishCodeCoverageResults@2
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/ci-results/coverage/coverage.lcov'
      pathToSources: '$(System.DefaultWorkingDirectory)'
    condition: always()
    displayName: 'Publish code coverage'

  # ── Publish: SARIF (static analysis) ───────────────────────
  # TODO: Uncomment when linters produce SARIF output.
  # The SARIF Scans Tab extension and Defender for ADO both
  # consume artifacts published under 'CodeAnalysisLogs'.
  # - task: PublishBuildArtifacts@1
  #   inputs:
  #     pathToPublish: '$(System.DefaultWorkingDirectory)/ci-results/sarif'
  #     artifactName: 'CodeAnalysisLogs'
  #   condition: always()
  #   displayName: 'Publish SARIF results'
