trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js 22'

  - script: sudo apt-get update && sudo apt-get install -y pandoc
    displayName: 'Install pandoc'

  - script: npm install
    displayName: 'Install dependencies'

  - script: npm test
    displayName: 'Run tests'

  - script: node bin/gantry.js render example-soap soap
    displayName: 'Render soap'

  - script: node bin/gantry.js render example-hld hld
    displayName: 'Render hld'

  - script: node bin/gantry.js render example-sad sad
    displayName: 'Render sad'

  - script: node bin/gantry.js render example-sad ssad
    displayName: 'Render ssad'

  - script: node bin/gantry.js render example-as-built as-built
    displayName: 'Render as-built'
