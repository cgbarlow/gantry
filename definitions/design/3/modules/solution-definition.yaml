id: solution-definition
title: Solution Definition
purpose: >
  Outline what the solution is and how it will work end to end, at a level that shows
  the shape without committing to the full architecture. Include the key requirements,
  process flow and who delivers each part.

fields:
  - id: high-level-requirements
    title: High-level requirements
    type: markdown
    required: true
    guidance: >
      The high-level requirements this solution must address. Use a markdown
      table with `Section` and `Requirement` columns when the work has several
      requirement groups; keep each requirement brief but specific enough to
      define the expected functionality and its scope. This is the agreed set
      that `nfrs.requirements-traceability` maps back to at detailed design —
      capture it here so nothing agreed can be quietly dropped.

  - id: process-flow
    title: Process flow
    type: markdown
    required: true
    guidance: >
      How work or data moves through the solution, step by step. A narrative
      walk-through is fine; a diagram reference is fine too, but describe
      what the diagram shows in words as well. Reused and deepened at
      `architecture.solution-description` — write the SOAP-level flow once.

  - id: high-level-solution-overview
    title: High level solution overview
    type: markdown
    required: true
    guidance: >
      The shape of the solution in outline — the main components and how
      they relate. This is a sketch, not the Detailed Design stage's
      `architecture` module; go only as deep as a SOAP-stage reader needs.

  - id: feature-breakdown
    title: Feature breakdown and involved teams
    type: markdown
    required: true
    guidance: >
      The solution broken into the features or workstreams that deliver it,
      and which teams are involved in each.

  - id: alternatives-sketch
    title: Alternatives sketch
    type: markdown
    required: false
    guidance: >
      Brief alternative(s) considered at SOAP, including "do nothing" —
      expanded at `modules/alternatives-considered.md` for the ARB; do not
      re-derive there.
