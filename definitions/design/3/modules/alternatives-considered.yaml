id: alternatives-considered
title: Alternatives considered
purpose: >
  Describe the other options that were on the table and why they were not chosen.
  Include "do nothing" where it helps show the proposed approach was compared, not just
  asserted.

fields:
  - id: alternatives
    title: Alternatives
    type: markdown
    target-words: { small: 70, medium: 180, large: 360 }
    required: true
    guidance: >
      For each alternative: what it was, and the specific reason it lost out
      to the proposed solution. "Do nothing" counts as an alternative and is
      often worth including explicitly.
