id: document-handling
title: Document handling
purpose: >
  Set how every document rendered from this design is marked and handled. The value prints on the
  cover page of each document.

# v3 (#196, spec #192): every v3 Artefact names this field as its `cover-classification`
# (ADR-0052), so the classification prints at the top of each document's cover. It is mounted at
# every Stage, from Shape onward, so it can be set before the first document is rendered and
# changed at any later Stage. It is optional at every gate: a blank classification leaves the
# cover without one rather than holding up a gate.
fields:
  - id: classification
    title: Classification
    type: select
    required: false
    options:
      - UNCLASSIFIED
      - IN-CONFIDENCE
      - SENSITIVE
      - RESTRICTED
    guidance: >
      The security classification of this design's documents, printed on the cover of every
      document rendered from it so a reader knows how to handle it before they start. The options
      are the New Zealand Protective Security Requirements (PSR) markings for information whose
      compromise would harm an organisation or individuals: UNCLASSIFIED, IN-CONFIDENCE,
      SENSITIVE and RESTRICTED. Choose the marking that fits the most sensitive content any of
      these documents carries; a design that describes member, customer or staff data, or the
      security controls protecting it, is usually IN-CONFIDENCE or higher. One value covers every
      document from this design. An organisation outside New Zealand, or one with its own
      scheme, should replace these options with its own markings in its copy of this definition.
