# The recovery *mechanism*. The targets it must meet — RTO, RPO, backup type,
# method, schedule, retention and the archiving policy — live once in
# `nfrs.disaster-recovery-and-backup`, which is carried through to handover so
# both render under the single "Failure and recovery" section without either
# field restating the other (CHANGED v2).

id: recovery-plan
title: Recovery Plan
purpose: >
  Describe how the solution recovers from failure — how it fails over, how it stays
  resilient, what has been tested and who is responsible.

fields:
  - id: recovery-approach
    title: Recovery approach
    type: markdown
    required-at: [build-ready-checklist, operational-handover]
    guidance: >
      The failover model for each layer of the solution (platform,
      workloads) — active-active vs active-passive, the availability tier, and
      the tool used to redeploy on failover. Reference the recovery targets in
      `nfrs.disaster-recovery-and-backup` rather than restating RTO/RPO here:
      this field describes how the solution meets them.

  - id: resiliency
    title: Resiliency
    type: markdown
    required: false
    guidance: >
      How the solution stays available through a zone or component failure —
      redundancy, availability zones, network/peering design.

  - id: test-scenarios
    title: Test scenarios
    type: markdown
    required: false
    guidance: >
      The recovery scenarios that are tested, the failover type for each,
      and a link to the technical recovery plan / runbook that covers it.

  - id: raci
    title: RACI
    type: markdown
    required: false
    guidance: >
      Who is Responsible, Accountable, Consulted and Informed for each
      recovery and ongoing-support task.
