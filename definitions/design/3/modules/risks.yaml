id: risks
title: Risks
purpose: >
  List the risks to delivering and operating this solution and how each will be
  mitigated. Include who owns each risk and its likelihood and impact before and after
  mitigation. This is one module used in both high-level design and detailed design —
  fill it progressively: during high-level design include the risks that could affect that
  decision; before build readiness include the fuller register needed to build against.

fields:
  - id: risk-register
    title: Risks and mitigations
    type: markdown
    target-words: { small: 85, medium: 175, large: 290 }
    required: true
    guidance: >
      Each risk with an owner, its likelihood/impact, its mitigation, and —
      where a mitigation is already underway — the current risk rating
      versus the projected rating once the mitigation lands. Not just a list
      of concerns with no response attached.

      Mark an owner who is not yet confirmed `(interim)` after their name, e.g.
      `Service owner — A. Ngata (interim)`, so temporary ownership isn't read
      as final.

  - id: open-issues
    title: Open issues
    type: markdown
    target-words: { small: 20, medium: 50, large: 100 }
    required: false
    guidance: >
      List unresolved issues that are not yet risks with a clear mitigation but need
      tracking before the design is approved for build.

      Mark an owner who is not yet confirmed `(interim)` after their name, e.g.
      `Service owner — A. Ngata (interim)`, so temporary ownership isn't read
      as final.
