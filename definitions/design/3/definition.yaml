id: design
version: 3
status: draft
title: Solution Design
description: >
  Design content for an initiative, from shaping through HLD approval,
  build-ready detailed design, and operational handover.

# v2 is a layout revision of v1. Every artefact's `requires` list is re-sequenced
# to the reading order of its reference document (see CHANGES.md for the
# heading-by-heading mapping and the confidence rating behind each move), and a
# small number of fields that asked for the same information twice are collapsed
# onto a single field that carries across stages. No field `id` is renamed.
#
# Ordering convention: an artefact's `requires` list is written in the order its
# sections render, so the list doubles as the document outline. `?` marks a field
# that is in the artefact's scope but only blocks the gate when its own
# `required` / `required-at` makes it mandatory. Every entry that was bare in v1
# is still bare, so no gate is looser than it was — with one deliberate
# exception, `hld`, which WI #362 trimmed to the TAC reference template's own
# sections; see that artefact's comment for exactly which two obligations moved.
#
# Stage/gate topology note: The real-world Contoso process resolves to four gates (see
# docs/research/stages-gates-module-specs.md, Section 3), not the three in Gantry's own
# illustrative README example. HLD approval at TAC is a distinct gate with no analogue in
# the README's worked example, so `define` has been split into `hld-define` and
# `detailed-design`. See docs/adr/0001 for why.

stages:
  - id: shape
    title: SOAP
    purpose: >
      Describe the initiative's context, proposed solution, team, estimates and
      dependencies in enough detail to support a business case decision.
    gate: business-case
    # The editor mounts the union of the two Shape artefacts' modules. Gate
    # passing itself is scoped to each artefact's `requires` list below.
    # `introduction` / `design-basis` are mounted from Shape onward, adjacent,
    # right after `background`: `in-scope` / `out-of-scope` are the canonical
    # cross-stage scope statement, and `design-basis`'s `assumptions` /
    # `constraints` / `caveats` accumulate from here.
    # CHANGED v2: `open-questions` is mounted here too, replacing the removed
    # `soap-full-details.questions` field — a question raised at Shape is the
    # same question TAC sees at HLD.
    # WI #331: `introduction` (retitled "Overview") and the new `design-basis`
    # module moved from 6th/7 to 2nd/3rd of 8, immediately after `background` —
    # the position they'd always logically belonged at, not buried near the end.
    # v3 (#196): `document-handling` (the documents' Classification) is mounted
    # at every Stage, from this one onward, after the content modules, so it is
    # set before the first document is rendered and can change at any later
    # Stage; every Artefact prints it on its cover.
    modules: [background, introduction, design-basis, solution-definition, team-and-estimates, dependencies, soap-full-details, open-questions, document-handling]
    # The instance the web form's "Populate example text" button reads from for this stage's fields — one shared instance covering every stage, so `gantry serve examples` shows every gate screen populated.
    example: kiwi-cover-mutual

  - id: hld-define
    title: High-level Design
    purpose: >
      Describe the proposed solution in enough detail to be approved before
      detailed design begins. Cover what is needed to decide whether to proceed.
    gate: hld-arb-approved
    # nfrs, risks, security and dependencies are introduced here in early/light form and
    # carried forward — not re-declared — at detailed-design, where the same module ids are
    # required in fuller form. See each module's guidance.
    # WI #331: `introduction` (retitled "Overview") moved from 10th/11 to 3rd of
    # 12, immediately after `background` — matching the position it mounts at in
    # every other stage.
    # WI #362: `design-basis` and `solution-definition` unmounted. The trimmed
    # `hld` artefact requires no field from either, and `hld` is this stage's only
    # artefact, so mounting them would put editor cards here that no HLD section
    # renders. Both still mount at `shape` and `detailed-design` — the
    # `design-basis` backbone accumulates there, not here.
    modules: [hld-submission, background, introduction, proposed-solution, alternatives-considered, open-questions, nfrs, risks, security, dependencies, document-handling]
    example: kiwi-cover-mutual

  - id: detailed-design
    title: Detailed Design
    purpose: >
      Describe the architecture, integration, data, quality, security, risk,
      dependency and operational details needed to build the solution.
    gate: build-ready-checklist
    # glossary, introduction, recovery-plan and data-security-controls are shared
    # modules (also required by the `handover` stage / `as-built` artefact).
    # CHANGED v2: `solution-definition` and `team-and-estimates` are mounted so the
    # SAD can render the agreed Shape requirements, the Shape process flow and the
    # references list without re-entry. `support-and-operations.environments-and-domains`
    # is now the SAD's environment list too (`integration.environments` is removed).
    # WI #331: `introduction` (retitled "Overview") and the new `design-basis`
    # module moved from 10th/11 to 1st/2nd of 15 — this stage has no context
    # module of its own to sit behind (unlike `background` at the other three
    # stages), so the pair mounts at the very front, matching the SAD's own
    # document layout.
    modules: [introduction, design-basis, architecture, integration, data, nfrs, security, risks, dependencies, support-and-operations, glossary, recovery-plan, data-security-controls, solution-definition, team-and-estimates, document-handling]
    example: kiwi-cover-mutual

  - id: handover
    title: Operational Handover
    purpose: >
      Record what was built and the information needed to hand it over for
      operation.
    gate: operational-handover
    # glossary, introduction, recovery-plan and data-security-controls are shared modules
    # (see docs/research/design-definition-reference-reconciliation.md). They carry the
    # reference ATLAS design's Terms & Definitions / Introduction / Recovery Plan / Data
    # Security Controls sections, which this stage previously buried inside as-built-notes
    # free-text fields.
    # CHANGED v2 (round 2): `nfrs` mounted so `disaster-recovery-and-backup` — the
    # recovery targets — travels with the as-built recovery mechanism.
    # WI #331: the new `design-basis` module mounts adjacent to `introduction`
    # (retitled "Overview"), which already sat 2nd/6 at this stage — the pair
    # is now 2nd/3rd of 7.
    modules: [glossary, introduction, design-basis, as-built-notes, recovery-plan, data-security-controls, nfrs, document-handling]
    example: kiwi-cover-mutual

artefacts:
  # v3 (#196, spec #192): every Artefact opens with a cover page and a table of
  # contents (ADR-0052). The cover prints the Classification from
  # `document-handling.classification`, listed first in each `requires` (`?`,
  # so no gate waits on it), and the instance's display name as the title, so
  # no template opens with its own `# <slug>: <title>` line any more: section 1
  # follows the table of contents directly.
  # #205: the cover prints each Artefact's `cover-purpose`, a statement for
  # the reader ("This document describes ..."). `purpose` stays the
  # instruction to the author that the User Guide and Definitions page show.
  - id: soap
    title: Solution on a Page
    purpose: >
      Summarise the initiative's context, solution, team and estimates for the
      business case decision.
    template: templates/soap.md.tmpl
    gate: business-case
    # #195 (ADR-0053): number every diagram "Diagram N. <title>" in the Word document.
    diagram-captions: true
    cover-page: true
    cover-classification: document-handling.classification
    cover-purpose: >
      This document summarises the initiative's context, solution, team and
      estimates for the business case decision.
    table-of-contents: true
    # Order follows the reference SOAP (SAMPLE SOAP - Mobile Phone Assistance):
    # Background and context -> Solution definition (Process flow, High level
    # solution design, Assumptions and considerations, Feature breakdown) ->
    # Teams, contact persons and high-level estimates -> References.
    #
    # CHANGED v2:
    #  - `introduction.assumptions?` restored. The reference SOAP carries an
    #    "Assumptions and considerations" section; when WI #280 deleted
    #    `solution-definition.assumptions-and-considerations` and moved the
    #    concept to `introduction.assumptions`, the replacement was wired into
    #    `soap-full` and `hld` but not into `soap`, so the lightweight SOAP lost
    #    the section. Optional, so the gate is unchanged.
    #    WI #331: `introduction.assumptions` -> `design-basis.assumptions` —
    #    `assumptions` moved module, this artefact's rendering is unchanged
    #    (still no standalone Overview/Design Basis heading here; it still
    #    folds into "Assumptions and considerations" mid-document).
    #  - `solution-definition.high-level-requirements` moved ahead of
    #    `process-flow`. The Full SOAP reference states requirements before the
    #    solution overview; requirements-then-flow-then-shape also reads better
    #    than shape-then-requirements.
    #  - `introduction.in-scope` / `.out-of-scope` removed. The reference SOAP has
    #    no scope section; scope is a Full SOAP concept that WI #280 pushed onto
    #    the lightweight artefact. `business-case` is also out of those fields'
    #    `required-at`, so a lightweight SOAP carries no scope obligation. The
    #    Full SOAP still lists both as bare field references, so producing one
    #    still forces them at this gate.
    requires:
      [
        document-handling.classification?,
        background.problem,
        background.affected-domains,
        solution-definition.high-level-requirements,
        solution-definition.process-flow,
        solution-definition.high-level-solution-overview,
        design-basis.assumptions?,
        solution-definition.feature-breakdown,
        team-and-estimates.teams-required,
        team-and-estimates.estimates,
        team-and-estimates.references?,
      ]

  - id: soap-full
    title: Full Solution on a Page
    purpose: >
      Provide a fuller summary with detailed scope, dependencies, sequencing,
      dates and open questions.
    template: templates/soap-full.md.tmpl
    gate: business-case
    diagram-captions: true
    cover-page: true
    cover-classification: document-handling.classification
    cover-purpose: >
      This document gives a fuller summary of the initiative, with its detailed
      scope, dependencies, sequencing, dates and open questions.
    table-of-contents: true
    # Order follows the JEDI Full SOAP reference document exactly: the
    # front-matter metadata block, then Introduction, Problem statement,
    # Opportunity, In Scope, Out of Scope, High Level Requirements, High level
    # solution overview, Teams required, Dependencies, Assumptions, Estimates,
    # Sequencing, Questions, Caveats, References.
    #
    # CHANGED v2:
    #  - `introduction.overview?` added. The reference opens with an
    #    "Introduction" section that had no field at all.
    #  - `soap-full-details.questions` -> `open-questions.questions`. Same
    #    concept as the HLD's "Open questions"; now one field across both stages.
    #  - `introduction.caveats?` removed from this artefact. It sat alongside
    #    `soap-full-details.caveats`, so the Full SOAP had two "Caveats"
    #    sections. `soap-full-details.caveats` is the estimate caveats the
    #    reference renders; `introduction.caveats` still carries design caveats
    #    forward to the SAD and as-built.
    #  - `solution-definition.alternatives-sketch?` kept but moved to sit with
    #    the solution overview it qualifies; it has no analogue in the reference.
    #
    # WI #331: `introduction.assumptions?` / `.constraints?` -> `design-basis.*`,
    # moved from just before Estimates to a new "# Design basis" section right
    # after Out of scope — adjacent to the Overview/Introduction content this
    # module split off. This DEVIATES from the JEDI reference's literal section
    # order (which places Assumptions/Constraints near the end); deliberate,
    # per the ticket's Plan comment — cross-document consistency for a
    # recurring backbone module is worth more than exact fidelity to one
    # legacy reference document's placement of "Assumptions". The `# Introduction`
    # heading itself (wrapping `overview` + `background.problem`) is
    # reference-mandated and stays put, unrenamed.
    requires:
      [
        document-handling.classification?,
        soap-full-details.epic-project,
        soap-full-details.requested-lead-by,
        soap-full-details.request-date,
        soap-full-details.draft-agreed-date,
        soap-full-details.delivered-date,
        introduction.overview?,
        background.problem,
        background.opportunity,
        introduction.in-scope,
        introduction.out-of-scope,
        design-basis.assumptions?,
        design-basis.constraints?,
        solution-definition.high-level-requirements,
        solution-definition.high-level-solution-overview,
        solution-definition.alternatives-sketch?,
        team-and-estimates.teams-required,
        dependencies.dependencies-overview,
        team-and-estimates.estimates,
        soap-full-details.sequencing,
        open-questions.questions,
        soap-full-details.caveats,
        team-and-estimates.references,
      ]

  - id: hld
    title: High Level Design
    purpose: >
      Present the proposed solution, alternatives, risks and open questions for
      approval before detailed design.
    template: templates/hld.md.tmpl
    gate: hld-arb-approved
    diagram-captions: true
    cover-page: true
    cover-classification: document-handling.classification
    cover-purpose: >
      This document presents the proposed solution, its alternatives, risks and
      open questions for approval before detailed design.
    table-of-contents: true
    # Order follows the TAC HLD reference template: cover block -> Problem
    # Statement (Current state, Desired future state, In scope / out of scope,
    # Success criteria, Non-functional requirements) -> Proposed solution
    # (Alignment with strategy, Dependencies, Implications, Trade-offs, Risks and
    # mitigations, Security and privacy, Cost-benefit analysis, Delivery approach)
    # -> Alternatives considered -> Open questions -> Attachment/s.
    #
    # CHANGED v2 — this artefact moved the most. v1 listed whole modules, which
    # rendered nfrs / risks / security / dependencies *after* Alternatives and
    # Open questions, and scope last of all; the reference places scope inside
    # Problem Statement and the other four inside Proposed solution. The list is
    # field-level so the order can match, and `hld-submission.attachments?` moved
    # from first to last, matching "Attachment/s" as the reference's final
    # section.
    #
    # WI #362 — one entry per reference section, and nothing else. Going
    # field-level in v2 was done by listing *every* field of the four
    # whole-module entries so editor scope would not change, which grew the list
    # to 38 against the reference's 19 headed body sections. 14 entries are now
    # gone: the per-field `nfrs` / `security` tail, `dependencies.dependency-list`
    # and `risks.open-issues` (build-ready concerns surfaced early), the three
    # `design-basis.*` fields, `background.affected-domains` and
    # `solution-definition.high-level-solution-overview` (gantry-only content the
    # TAC template has no heading for). CHANGELOG.md lists all 14 by name. No
    # data is lost: every dropped field still mounts at the stage that owns it
    # (Shape or Detailed Design), so anything already written stays on disk and
    # reappears there.
    #
    # Design basis is deliberately NOT carried here, reversing WI #331's
    # "every artefact" placement for this one document — see docs/adr/0032. The
    # TAC template has no home for assumptions / constraints / caveats, and for
    # a paper written to be read by TAC, fidelity to the reference beats
    # cross-document consistency.
    #
    # Kept gantry-only additions, all endorsed by the WI #266 reconciliation:
    # the headed `# Submission` block (the reference's cover is a table of rows,
    # not headings), `proposed-solution.guardrails` as the Proposed solution
    # intro paragraph (prose in the reference too, not a section), and
    # `hld-submission.attachments?` rendered last.
    #
    # Gate note. `nfrs.performance`, `nfrs.availability-and-continuity` and
    # `security.privacy-and-confidentiality` stay bare and declare
    # `required-at: [hld-arb-approved, ...]` in their own module YAML — the
    # reference makes both sections mandatory, and v1 enforced neither. Of the
    # 14 dropped entries, 12 did not gate at `hld-arb-approved` at all. The two
    # that did are `background.affected-domains` and
    # `solution-definition.high-level-solution-overview` (both `required: true`,
    # so an `?` suffix did not exempt the latter). Both stay mandatory at
    # `business-case`, which every HLD is downstream of, and
    # `high-level-solution-overview` was only ever asked for at this gate from
    # v2 onwards — so this restores v1 behaviour for it.
    requires:
      [
        document-handling.classification?,
        hld-submission.purpose-statement,
        hld-submission.authors-and-contributors?,
        hld-submission.decision-requested,
        hld-submission.next-steps?,
        hld-submission.consultation,
        background.problem,
        background.opportunity,
        introduction.in-scope,
        introduction.out-of-scope,
        background.success-criteria,
        nfrs.performance,
        nfrs.availability-and-continuity,
        proposed-solution.guardrails,
        proposed-solution.strategy-alignment,
        dependencies.dependencies-overview,
        proposed-solution.implications?,
        proposed-solution.trade-offs,
        risks.risk-register,
        security.privacy-and-confidentiality,
        proposed-solution.cost-benefit,
        proposed-solution.delivery-approach,
        alternatives-considered.alternatives,
        open-questions.questions?,
        hld-submission.attachments?,
      ]

  - id: sad
    title: Solution Architecture Document
    purpose: >
      Describe the complete solution architecture and its requirements,
      security, dependencies and support handover readiness for build.
    template: templates/sad.md.tmpl
    gate: build-ready-checklist
    diagram-captions: true
    cover-page: true
    cover-classification: document-handling.classification
    cover-purpose: >
      This document describes the complete solution architecture and its
      requirements, security, dependencies and support handover readiness for
      build.
    table-of-contents: true
    # Order follows SAD Template.docx: Introduction / Overview -> Business
    # Architecture View -> Solution Overview (+ Dependencies) -> High Level
    # Architectural View -> Open Issues -> Logical Components View ->
    # Requirements Traceability -> Technology Architecture + Deployment View ->
    # Failure & Recovery -> Information View -> Security View -> Operating
    # Considerations -> References.
    #
    # CHANGED v2 — the four big moves, all to match the reference:
    #  - `dependencies` moves early (the reference puts Dependencies under
    #    Solution Overview, §6); v1 had it second-to-last.
    #  - `risks.open-issues` moves to its own position after the architectural
    #    view (the reference's "Open Issues", §8); v1 buried it late with risks.
    #  - `recovery-plan` + `nfrs.disaster-recovery-and-backup` move before the
    #    Information View (the reference's "Failure & Recovery", §14); v1 had
    #    recovery near the very end.
    #  - the `nfrs` performance/scalability/availability fields move late, to the
    #    reference's "Operating Considerations" (§17) where the detail actually
    #    sits; `nfrs.requirements-traceability` stays mid-document at the
    #    reference's "Requirements Traceability" (§10-11).
    # Newly wired-in for reuse (all optional, so the gate is unchanged):
    # stakeholders (the reference's "Stakeholder Mapping"), the Shape process
    # flow and requirement set ("Business Process" / "Relevant Functional
    # Requirements"), the five `integration` deployment fields that existed but
    # no artefact rendered (Hardware, Bandwidth, Network Devices, Communication
    # & Network Protocols, SAN), the three optional `recovery-plan` fields,
    # `data-security-controls.inheritance-and-dependencies`, operational
    # accounts / monitoring (the reference's "Terms & Conditions and Contracts"
    # and "Systems Management & Monitoring"), and `team-and-estimates.references`
    # (the reference's "References" under Document Control).
    # MERGED: `integration.environments` -> `support-and-operations.environments-and-domains`.
    # NOTE: `glossary.terms-and-definitions` is retained although SAD Template.docx
    # has no glossary section — the v1 comment claiming it does is incorrect. The
    # SSAD and the as-built references both carry one and it is worth keeping.
    #
    # CHANGED v2 (round 2), all optional so the gate is unchanged:
    #  - `introduction.executive-summary?` opens the document (reference §1).
    #  - `architecture.solution-users?` carries "Solution Users" (§5.2.1), which
    #    had no field: the reference asks for a User / Description table of the
    #    roles that use the system.
    #  - `integration.software-and-licences?` carries "Application Software View"
    #    (§13.1), which had no field: software, version, total count and licences
    #    per environment.
    #  - `support-and-operations.decommission?` carries "Decommission" (§17.9),
    #    previously folded into `nfrs.other-nfrs`. End of life is an operational
    #    lifecycle commitment, not a quality attribute.
    # NOT modelled, by decision: "Executive Summary" is now covered, but
    # "Tables & Figures" (§3), "Document Control" and its Approved By / Consulted /
    # Distribution sub-sections (§18) and the SAD's own "Appendix" (§19) are left
    # to the tool and the repo rather than given fields. "Hosting & Sites" (§12.3)
    # is deliberately folded into `integration.network-and-infrastructure`.
    #
    # WI #331: `introduction.assumptions?` / `.constraints?` -> `design-basis.*`,
    # kept in the same document position (right after Out of scope) — this
    # artefact already unified the framing and conditions clusters under one
    # "# Introduction" heading; the template now splits that heading into
    # "# Overview" and "# Design basis", still adjacent, still first.
    requires:
      [
        document-handling.classification?,
        introduction.executive-summary?,
        introduction.overview,
        introduction.purpose,
        introduction.in-scope,
        introduction.out-of-scope,
        design-basis.assumptions?,
        design-basis.constraints?,
        support-and-operations.stakeholders?,
        architecture.business-context,
        architecture.solution-users?,
        solution-definition.process-flow?,
        solution-definition.high-level-requirements?,
        architecture.solution-description,
        dependencies.dependencies-overview,
        dependencies.dependency-list,
        architecture.design-decisions,
        architecture.architectural-risks,
        architecture.constraints,
        architecture.standards,
        risks.open-issues,
        risks.risk-register,
        architecture.logical-components,
        nfrs.requirements-traceability,
        integration.interfaces,
        integration.network-and-infrastructure,
        integration.software-and-licences?,
        integration.hardware?,
        integration.bandwidth?,
        integration.network-devices?,
        integration.communication-and-network-protocols?,
        integration.san?,
        recovery-plan.recovery-approach,
        recovery-plan.resiliency?,
        recovery-plan.test-scenarios?,
        recovery-plan.raci?,
        nfrs.disaster-recovery-and-backup,
        data.logical-data-model,
        data.data-classification,
        data.data-replication,
        data.data-retention-and-archiving,
        data.data-migration,
        support-and-operations.environments-and-domains,
        security.identity-and-access,
        security.security-architecture,
        security.regulations-and-standards,
        security.privacy-and-confidentiality,
        data-security-controls.controls,
        data-security-controls.inheritance-and-dependencies?,
        support-and-operations.operational-accounts-and-licenses?,
        nfrs.scalability-and-capacity,
        nfrs.performance,
        nfrs.availability-and-continuity,
        support-and-operations.monitoring-and-alerting?,
        nfrs.other-nfrs,
        support-and-operations.decommission?,
        support-and-operations.support-handover-readiness,
        glossary.terms-and-definitions,
        team-and-estimates.references?,
      ]

  - id: ssad
    title: Solution Support Architecture Document
    purpose: >
      Describe the solution's design and operational readiness for the teams
      that will support it after build.
    template: templates/ssad.md.tmpl
    gate: build-ready-checklist
    diagram-captions: true
    cover-page: true
    cover-classification: document-handling.classification
    cover-purpose: >
      This document describes the solution's design and operational readiness
      for the teams that will support it after build.
    table-of-contents: true
    # #213: the SSAD follows the SAD's reading order and heading names, not the
    # FV Help Tool SSAD reference's. That reference is a filled instance for one
    # product family, not a template, and its order (Solution Products and
    # Architectural Risks before the Introduction, one Solution Overview holding
    # everything else) made the SSAD read nothing like the SAD rendered from the
    # same data at the same Gate. See docs/adr/0057 — the counterpart to
    # ADR-0032, which kept reference fidelity for the HLD.
    #
    # Order: Overview -> Design basis -> Business architecture (Stakeholders and support
    # contacts) -> Solution overview (Solution description, Dependency list,
    # Architectural risks) -> Open issues -> Risks -> Logical components view
    # -> Technology architecture (Interfaces) -> Support and operations ->
    # Glossary -> References. Every chapter up to Technology architecture is the
    # SAD's, in the SAD's order, holding only the fields the SSAD renders. The
    # support-team material then stays together in one "Support and operations"
    # chapter rather than spreading across the SAD's Failure and recovery,
    # Information view, Security and Operating considerations chapters.
    #
    # Same fields, same strictness: no field entered or left this list, and every
    # entry keeps its bare / `?` form. `stakeholders`, `monitoring-and-alerting`
    # and `operational-accounts-and-licenses` stay bare here though the SAD
    # lists them with `?` — the SSAD is the document a support team needs them in.
    #
    # #214: the SSAD opens the way the SAD does. `introduction.overview` joins the
    # Overview chapter (bare, as in the SAD) and `design-basis.assumptions?` /
    # `.constraints?` render as a "Design basis" chapter right after it, only
    # when filled. Authors are asked for nothing new: the SAD already requires
    # `overview` at this Gate, and `design-basis` is mounted at Detailed Design.
    #
    # History, v2: `architecture.architectural-risks` / `.logical-components`
    # opened the document and `release-procedures` sat late, both to match the
    # FV reference; `introduction.content-standards?` and
    # `team-and-estimates.references?` were wired in. v2 (round 2):
    # `introduction.executive-summary?` added, and
    # `support-and-operations.operational-security-controls` replaced by
    # `data-security-controls.controls` (+ `.inheritance-and-dependencies?`), so
    # security has two homes layered by stage: `security` for the design-time
    # posture (opens at HLD), `data-security-controls` for the control set (opens
    # at detailed design, re-opens as-built at handover).
    requires:
      [
        document-handling.classification?,
        introduction.executive-summary?,
        introduction.overview,
        introduction.purpose,
        introduction.in-scope,
