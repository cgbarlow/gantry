# v4 (#359): the optional `references` list Field is gone. Its guidance asked for source documents,
# which the Sources appendix already lists for every document that cites them, so a v3 document
# printed them twice.
id: team-and-estimates
title: Teams, contact persons, and high-level estimates
purpose: >
  List the teams involved and the order-of-magnitude sizing for the work. This is a
  signal for planning, not a commitment.

fields:
  - id: teams-required
    title: Teams required
    type: list
    target-words: { small: 35, medium: 90, large: 180 }
    required: true
    guidance: >
      Every team touched by this solution and a named contact for each —
      not just the obvious delivery team.

  - id: estimates
    title: Estimates
    type: markdown
    target-words: { small: 50, medium: 100, large: 170 }
    required: true
    guidance: >
      T-shirt size (or equivalent order-of-magnitude estimate) per team or
      workstream. This is a sizing signal for planning, not a commitment.

