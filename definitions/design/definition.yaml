id: design
title: Solution Design
description: >
  Design content for an initiative, from shaping through HLD approval,
  build-ready detailed design, and operational handover.

# Stage/gate topology note: The real-world Contoso process resolves to four gates (see docs/research/stages-gates-module-specs.md, Section 3), not the three in Gantry's own illustrative README example. HLD approval at TAC is a distinct gate with no analogue in the README's worked example, so `define` has been split into `hld-define` and `detailed-design`. See docs/adr/0001 for why.

stages:
  - id: shape
    title: SOAP
    purpose: >
      Shape an initiative into a clear business case by capturing its context,
      proposed solution, team, estimates, and dependencies.
    gate: business-case
    # The editor mounts the union of the two Shape artefacts' modules. Gate
    # passing itself is scoped to each artefact's `requires` list below.
    modules: [context, solution-definition, team-and-estimates, dependencies, soap-full-details]
    # The instance the web form's "Populate example text" button reads from for this stage's fields — one shared instance covering every stage, so `gantry serve examples` shows every gate screen populated.
    example: examples

  - id: hld-define
    title: High-level Design
    purpose: >
      Define the proposed solution in enough detail for approval by the
      Technical Architecture Committee before detailed design begins.
    gate: hld-tac-approved
    # nfrs, risks, security and dependencies are introduced here in early/light form and carried forward — not re-declared — at detailed-design, where the same module ids are required in fuller form. See each module's guidance.
    modules:
      [hld-submission, problem-statement, proposed-solution, alternatives-considered, open-questions, nfrs, risks, security, dependencies]
    example: examples

  - id: detailed-design
    title: Detailed Design
    purpose: >
      Describe the architecture, integration, data, quality, security, risk,
      dependency, and operational details needed to build the solution.
    gate: build-ready-checklist
    # glossary, introduction, recovery-plan and data-security-controls are shared
    # modules (also required by the `handover` stage / `as-built` artefact). The SAD
    # reference template (`SAD Template.docx`) carries first-class Introduction /
    # Overview / Solution Scope, a named "Failure & Recovery" section, "Security
    # Concerns" inside its Security View, and a trailing Glossary — all now sourced
    # from these shared modules rather than re-typed at this stage. See the
    # reconciliation doc, Section 5 (WI #228 applied the SAD side; #227 the glossary).
    modules: [architecture, integration, data, nfrs, security, risks, dependencies, support-and-operations, glossary, introduction, recovery-plan, data-security-controls]
    example: examples

  - id: handover
    title: Operational Handover
    purpose: >
      Record the as-built solution and the information needed to hand it over
      for operation and submission to the Technical Architecture Committee for
      noting.
    gate: operational-handover
    # glossary, introduction, recovery-plan and data-security-controls are shared modules
    # (see docs/research/design-definition-reference-reconciliation.md). They carry the
    # reference ATLAS design's Terms & Definitions / Introduction / Recovery Plan / Data
    # Security Controls sections, which this stage previously buried inside as-built-notes
    # free-text fields.
    modules: [glossary, introduction, as-built-notes, recovery-plan, data-security-controls]
    example: examples

artefacts:
  - id: soap
    title: Solution on a Page
    purpose: >
      Summarise the initiative's context, solution, team, and estimates for
      Business Case Approved.
    template: templates/soap.md.tmpl
    gate: business-case
    requires: [context, solution-definition, team-and-estimates]

  - id: soap-full
    title: Full Solution on a Page
    purpose: >
      Provide a fuller Solution on a Page with detailed scope, dependencies,
      sequencing, dates, and delivery questions.
    template: templates/soap-full.md.tmpl
    gate: business-case
    # Field references let this heavier artefact reuse modules without making
    # the lightweight SOAP's unrelated fields mandatory.
    requires:
      [
        context.driver,
        context.opportunity,
        context.in-scope,
        context.out-of-scope,
        solution-definition.high-level-requirements,
        solution-definition.high-level-solution-design,
        solution-definition.assumptions-and-considerations,
        team-and-estimates.teams-and-contacts,
        team-and-estimates.estimates,
        team-and-estimates.references,
        dependencies.dependencies-overview,
        soap-full-details.epic-project,
        soap-full-details.requested-lead-by,
        soap-full-details.request-date,
        soap-full-details.draft-agreed-date,
        soap-full-details.delivered-date,
        soap-full-details.sequencing,
        soap-full-details.questions,
      ]

  - id: hld
    title: High Level Design
    purpose: >
      Present the proposed solution, alternatives, risks, and open questions
      to the Technical Architecture Committee for approval.
    template: templates/hld.md.tmpl
    gate: hld-tac-approved
    requires:
      [hld-submission, problem-statement, proposed-solution, alternatives-considered, open-questions, nfrs, risks, security, dependencies]

  - id: sad
    title: Solution Architecture Document
    purpose: >
      Describe the complete solution architecture and its requirements,
      security, dependencies, and support handover readiness for build.
    template: templates/sad.md.tmpl
    gate: build-ready-checklist
    # SAD renders the complete architecture, requirements, security and
    # dependency views, plus only the support handover summary. The detailed
    # operational content belongs to SSAD.
    #
    # WI #228: the shared introduction / recovery-plan / data-security-controls
    # modules are wired in field-level, matching the `as-built` pattern — only the
    # fields that must gate are listed (introduction overview/purpose/scope,
    # recovery-plan.recovery-approach, data-security-controls.controls). The
    # optional shared-module fields (introduction.constraints…, recovery-plan
    # resiliency/test-scenarios/raci, data-security-controls.inheritance-and-dependencies)
    # are rendered by the template's `if` guards when an instance fills them.
    # `nfrs.disaster-recovery-and-backup` is retained: it carries the Backup &
    # Archiving Policy, rendered alongside recovery-plan under the single
    # "Failure and recovery" section (see the reconciliation doc, Section 5).
    requires:
      [
        introduction.overview,
        introduction.purpose,
        introduction.scope,
        architecture.business-context,
        architecture.design-decisions,
        architecture.solution-description,
        architecture.logical-components,
        architecture.standards,
        architecture.architectural-risks,
        architecture.constraints-and-assumptions,
        integration.interfaces,
        integration.network-and-infrastructure,
        integration.environments,
        data.logical-data-model,
        data.data-classification,
        data.data-retention-and-archiving,
        data.data-migration,
        data.data-replication,
        nfrs.performance,
        nfrs.availability-and-continuity,
        nfrs.disaster-recovery-and-backup,
        nfrs.scalability-and-capacity,
        nfrs.other-nfrs,
        nfrs.requirements-traceability,
        security.identity-and-access,
        security.security-architecture,
        security.regulations-and-standards,
        security.privacy-and-confidentiality,
        risks.risk-register,
        risks.open-issues,
        dependencies.dependencies-overview,
        dependencies.dependency-list,
        support-and-operations.support-handover-readiness,
        recovery-plan.recovery-approach,
        data-security-controls.controls,
        glossary.terms-and-definitions,
      ]

  - id: ssad
    title: Solution Support Architecture Document
    purpose: >
      Frame the solution's design and operational readiness for the teams that
      will support it after build.
    template: templates/ssad.md.tmpl
    gate: build-ready-checklist
    # SSAD is the support-focused rendering of the same design data. It needs
    # operational readiness in full, but only the design fields that its
    # support-oriented template actually presents.
    #
    # WI #229: the shared `introduction` module is wired in field-level
    # (introduction.purpose / .scope) — a first-class `# Introduction` now opens
    # the SSAD, matching the FV Help Tool SSAD reference. `introduction.content-standards`
    # (the reference's "Content Standards" sub-section) is optional and rendered
    # by the template's `if` guard when an instance fills it. The SAD and SSAD
    # sharing `introduction.purpose` / `.scope` is the same shared-module pattern
    # as their existing `nfrs` / `security` / `architecture.solution-description`
    # overlap — the HLD keeps its own `problem-statement` framing and does not
    # reference `introduction` (see the reconciliation doc, Section 6).
    requires:
      [
        introduction.purpose,
        introduction.scope,
        support-and-operations.stakeholders,
        support-and-operations.environments-and-domains,
        support-and-operations.release-procedures,
        support-and-operations.support-handover-readiness,
        support-and-operations.operational-accounts-and-licenses,
        support-and-operations.operational-security-controls,
        support-and-operations.monitoring-and-alerting,
        architecture.solution-description,
        architecture.logical-components,
        architecture.architectural-risks,
        integration.interfaces,
        data.data-classification,
        risks.risk-register,
        risks.open-issues,
        nfrs.availability-and-continuity,
        nfrs.disaster-recovery-and-backup,
        nfrs.scalability-and-capacity,
        security.identity-and-access,
        security.privacy-and-confidentiality,
        dependencies.dependency-list,
        glossary.terms-and-definitions,
      ]

  - id: as-built
    title: As-built
    purpose: >
      Capture what was built and the final handover information for operational
      use and TAC noting.
    template: templates/as-built.md.tmpl
    gate: operational-handover
    # Section order mirrors the approved ATLAS reference design: Terms & Definitions →
    # Introduction → As-built design → Infrastructure → Recovery plan → Data security
    # controls → Appendix, then the gantry-only governance sections (see the template).
    # Only the fields that must be present to pass the gate are listed here — a
    # `module.field` entry is checked for non-emptiness regardless of the field's own
    # `required` flag, so the optional fields (introduction.constraints…, recovery-plan
    # detail, as-built-notes.appendix/architecture-decisions/operational-notes,
    # data-security-controls.inheritance-and-dependencies) are left out and rendered
    # by the template's `if` guards when the instance fills them.
    requires:
      [
        glossary.terms-and-definitions,
        introduction.overview,
        introduction.purpose,
        introduction.scope,
        as-built-notes.design-overview,
        as-built-notes.process-flows,
        as-built-notes.infrastructure-and-configuration,
        as-built-notes.changes-from-design,
        as-built-notes.acceptance-criteria,
        as-built-notes.handover-confirmation,
        recovery-plan.recovery-approach,
        data-security-controls.controls,
      ]
