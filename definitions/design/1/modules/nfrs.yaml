id: nfrs
title: Non-Functional Requirements
purpose: >
  Describe the quality attributes the solution must meet, such as performance,
  availability and scalability. State the targets clearly enough to design and test
  against. This is one module used in both high-level design and detailed design —
  fill it progressively: during high-level design include only the NFRs that shape that
  decision; before build readiness it should be complete enough to design and test
  against.

fields:
  - id: performance
    title: Performance
    type: markdown
    required-at: [build-ready-checklist]

  - id: availability-and-continuity
    title: Availability and continuity
    type: markdown
    required-at: [build-ready-checklist]

  - id: disaster-recovery-and-backup
    title: Disaster recovery and backup
    type: markdown
    required-at: [build-ready-checklist]
    guidance: >
      Describe recovery time and point objectives, backup schedule and retention, and the
      disaster-recovery approach. You can keep this light during high-level design; it
      should be complete before build readiness — a support team needs concrete recovery
      targets and backup detail, not just an availability target.
  - id: scalability-and-capacity
    title: Scalability and capacity
    type: markdown
    required-at: [build-ready-checklist]

  - id: other-nfrs
    title: Other non-functional requirements
    type: markdown
    required: false
    guidance: >
      Anything that doesn't fit the categories above but still constrains
      the solution — e.g. compliance-driven quality attributes, contractual
      obligations, or decommissioning/future-considerations notes.

  - id: requirements-traceability
    title: Requirements traceability
    type: markdown
    required-at: [build-ready-checklist]
    guidance: >
      Describe how the design maps back to the agreed functional and non-functional
      requirements — enough for a reviewer to check nothing was quietly dropped. You can
      keep this light during high-level design; it should be complete before build
      readiness.
