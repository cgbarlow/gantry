id: glossary
title: Glossary
purpose: >
  The terms, acronyms and abbreviations a reader needs to follow the rest of
  the document. A recurring section in the reference documents — the SAD
  template's "Glossary", the FV Help Tool SSAD's "Glossary", and the approved
  ATLAS design's "Terms & Definitions" all carry the same content — so it is a
  shared module referenced from the `sad`, `ssad` and `as-built` artefacts
  rather than re-typed in each. See
  docs/research/design-definition-reference-reconciliation.md Section 1.

fields:
  - id: terms-and-definitions
    title: Terms and definitions
    type: markdown
    required-at: [build-ready-checklist, operational-handover]
    guidance: >
      A table of the acronyms, abbreviations and domain terms used in this
      solution's design and as-built documents, each with a one-line
      definition. The SAD, SSAD and as-built reference documents all carry
      this section, so it is required from `build-ready-checklist` onward — a
      reader unfamiliar with Contoso's systems must be able to follow the
      document unaided.
