id: proposed-solution
title: Proposed Solution
purpose: >
  Describe the proposed solution and why it is the right choice. Cover how it aligns
  with strategy, its costs and benefits, implications and what you are trading off.

fields:
  - id: strategy-alignment
    title: Alignment with strategy
    type: markdown
    required: true
    guidance: >
      Builds on the Shape sketch — see `solution-definition`
      (`high-level-solution-overview`, `feature-breakdown`). Do not re-derive;
      show how that shape aligns with strategy for TAC.

  - id: implications
    title: Implications
    type: markdown
    required: false

  - id: trade-offs
    title: Trade-offs
    type: markdown
    required: true
    guidance: >
      What you're giving up by choosing this solution over the alternatives
      recorded in `alternatives-considered` (seeded by
      `solution-definition.alternatives-sketch` at Shape).

  - id: delivery-approach
    title: Delivery approach and indicative timeline
    type: markdown
    required: true
    guidance: >
      Traceable to `team-and-estimates.estimates` — refine the Shape T-shirt
      sizes into an indicative timeline rather than re-deriving them.

  - id: guardrails
    title: Guardrails
    type: markdown
    required: true
    guidance: >
      List which guardrails this solution follows. If it seeks an exemption or introduces a
      new guardrail, say so explicitly.
  - id: cost-benefit
    title: Cost-benefit analysis
    type: markdown
    required: true
    guidance: >
      Cost versus benefit, including recurring costs and non-monetary
      comparisons (e.g. person-hours saved) where a dollar figure isn't
      meaningful. Start from `team-and-estimates.estimates` — refine, don't
      restate.
