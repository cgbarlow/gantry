id: risks
title: Risks
purpose: >
  The risks specific to delivering and running this solution, and how
  they're being mitigated. Derived from the SAD template's Architectural
  Risks / Open Issues content and the TAC template's Risks and mitigations
  table — see docs/research/stages-gates-module-specs.md Sections 4.2–4.3.

  This module is required at both HLD Definition and Detailed Design — one
  module, filled in progressively, not two. At `hld-tac-approved` expect the
  risks material enough to affect the HLD decision; at
  `build-ready-checklist` expect the fuller risk register needed to build
  against.

  Reviewed by the Design Authority before Build Readiness Confirmed, via the
  instance module file's frontmatter `status`/`owner` convention — see
  `architecture.yaml` for the same note.

fields:
  - id: risk-register
    title: Risks and mitigations
    type: markdown
    required: true
    guidance: >
      Each risk with an owner, its likelihood/impact, its mitigation, and —
      where a mitigation is already underway — the current risk rating
      versus the projected rating once the mitigation lands. Not just a list
      of concerns with no response attached.

  - id: open-issues
    title: Open issues
    type: markdown
    required: false
    guidance: >
      Unresolved issues that aren't yet risks with a clear mitigation, but
      need tracking before Build Readiness Confirmed.
