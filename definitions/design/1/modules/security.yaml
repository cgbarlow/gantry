id: security
title: Security
purpose: >
  Describe the solution's security and privacy posture — how users are authenticated
  and authorised, the security architecture and the regulations and standards that
  apply. This is one module used in both high-level design and detailed design — fill it
  progressively: during high-level design include the security implications that inform
  that decision; before build readiness include the full posture needed to build against.

  Design-time claims (who can do what, threat model, regulations). For the
  concrete controls the built solution runs under (encryption, networking,
  incident management) use `data-security-controls.controls`.

fields:
  - id: identity-and-access
    title: Identity and access management
    type: markdown
    required-at: [build-ready-checklist]
    guidance: >
      Authentication, authorisation, and the security roles involved.

  - id: security-architecture
    title: Security architecture
    type: markdown
    required-at: [build-ready-checklist]
    guidance: >
      Goals, constraints and assumptions specific to security — not a
      restatement of the general architecture.

  - id: regulations-and-standards
    title: Regulations and standards
    type: list
    required-at: [build-ready-checklist]

  - id: privacy-and-confidentiality
    title: Privacy and confidentiality concerns
    type: markdown
    required-at: [build-ready-checklist]
