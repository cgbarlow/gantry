id: problem-statement
title: Problem Statement
purpose: >
  Describe the problem this work is solving, stated clearly enough that a reviewer can
  judge the fit of the solution without inferring it. Cover current state, desired
  future state, scope and how success will be recognised.

fields:
  - id: current-state
    title: Current state
    type: markdown
    required: true

  - id: desired-future-state
    title: Desired future state
    type: markdown
    required: true

  - id: scope
    title: In scope / out of scope
    type: markdown
    required: true
    guidance: >
      Be explicit about what is in scope and what is out of scope. Silence on out-of-scope
      is the most common cause of papers being sent back with questions.
  - id: success-criteria
    title: Success criteria
    type: markdown
    required: true
    guidance: >
      How you'll know the desired future state has actually been reached —
      observable, not aspirational.
