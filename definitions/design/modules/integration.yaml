id: integration
title: Integration
purpose: >
  How this solution connects to everything around it — interfaces, and the
  technology/deployment surface those connections run over. Dependencies
  live in the shared `dependencies` module instead of being repeated here —
  see its guidance for what it covers at this stage. Derived from the SAD
  template's Technology Architecture View / Deployment View sections — see
  docs/research/stages-gates-module-specs.md Section 4.3.

  Reviewed by the Design Authority before Build Readiness Confirmed, via the
  instance module file's frontmatter `status`/`owner` convention — see
  `architecture.yaml` for the same note.

fields:
  - id: interfaces
    title: Interfaces
    type: markdown
    required: true
    guidance: >
      The integration points themselves — protocol, direction, and what
      crosses the boundary.

  - id: network-and-infrastructure
    title: Network and infrastructure
    type: markdown
    required: false
    guidance: >
      Network architecture, infrastructure architecture, hosting and sites
      relevant to how this solution is deployed and reached — including,
      where they apply: application/software licensing, hardware sizing,
      bandwidth requirements, and the network devices/protocols traffic
      crosses.

  - id: environments
    title: Environments
    type: list
    required: false
