id: integration
title: Integration
purpose: >
  How this solution connects to everything around it — dependencies,
  interfaces, and the technology/deployment surface those connections run
  over. Derived from the SAD template's Solution Overview (Dependencies) and
  Technology Architecture View / Deployment View sections — see
  docs/research/stages-gates-module-specs.md Section 4.3.

  Reviewed by the Design Authority before Build Readiness Confirmed, via the
  instance module file's frontmatter `status`/`owner` convention — see
  `architecture.yaml` for the same note.

fields:
  - id: dependencies
    title: Dependencies
    type: list
    required: true
    guidance: >
      Every system, service or team this solution depends on to function,
      and what it depends on them for.

  - id: interfaces
    title: Interfaces
    type: markdown
    required: true
    guidance: >
      The integration points themselves — protocol, direction, and what
      crosses the boundary.

  - id: network-and-infrastructure
    title: Network and infrastructure
    type: markdown
    required: false
    guidance: >
      Network architecture, infrastructure architecture, hosting and sites
      relevant to how this solution is deployed and reached.

  - id: environments
    title: Environments
    type: list
    required: false
