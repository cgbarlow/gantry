id: context
title: Context
purpose: >
  Why this initiative exists and what it is responding to. Enough for a reader
  with no prior knowledge to understand the situation in under two minutes.

fields:
  - id: driver
    title: Business driver
    type: markdown
    required: true
    guidance: >
      Open with a one-line summary of the initiative before the fuller
      narrative — the change in the world that makes this necessary:
      legislative, operational, commercial, or a constraint that has become
      binding.

  - id: affected-domains
    title: Affected domains
    type: list
    required: true

  - id: opportunity
    title: Opportunity
    type: markdown
    required: false
    guidance: >
      The opportunity this initiative creates if the problem is addressed —
      the better outcome, service, or capability that makes the change worth
      pursuing.

  - id: in-scope
    title: In scope
    type: markdown
    required: false
    guidance: >
      The features, functionality, and deliverables included within the
      boundaries of this solution and estimate.

  - id: out-of-scope
    title: Explicitly out of scope
    type: markdown
    required: false
