id: dependencies
title: Dependencies
purpose: >
  What this solution depends on, and what depends on it. Derived from the
  TAC template's Proposed Solution section and the SAD template's Solution
  Overview (Dependencies) section — see
  docs/research/stages-gates-module-specs.md Sections 4.2–4.3.

  This module is required at both HLD Definition and Detailed Design — one
  module, filled in progressively, not two. At `hld-tac-approved` a
  narrative overview is enough for TAC to judge the HLD decision; the full
  structured dependency list isn't expected until `build-ready-checklist`,
  where a delivery team needs to build against it.

  Reviewed by the Design Authority before Build Readiness Confirmed, via the
  instance module file's frontmatter `status`/`owner` convention — see
  `architecture.yaml` for the same note.

fields:
  - id: dependencies-overview
    title: Dependencies overview
    type: markdown
    required-at: [business-case, hld-tac-approved]
    guidance: >
      What this solution depends on, and what depends on it — other
      initiatives, platforms, teams, or decisions still in flight. Enough
      for TAC to judge the HLD decision without a full dependency list yet.

  - id: dependency-list
    title: Dependency list
    type: list
    required-at: [build-ready-checklist]
    guidance: >
      Every system, service or team this solution depends on to function,
      and what it depends on them for — the complete list needed to build
      against.
