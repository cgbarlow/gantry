id: identity
title: Identity
purpose: >
  The digital identity created for the starter: the account itself, where it propagated to, and
  how the credentials reached the person.

  Identity creation and device build together account for around five days of the schedule, and
  they are the last five. There is no slack behind them.

fields:
  - id: account
    title: Account
    type: markdown
    required: true
    guidance: >
      The user ID issued, when, and in which identity platform. Record the date the account was
      created rather than the date it was requested — the gap between the two is where this
      phase loses time.

  - id: propagation
    title: Propagation
    type: markdown
    required: true
    guidance: >
      Confirmation that the identity reached the directory service and the downstream systems
      provisioned from it, including the service management platform. Note anything that had to
      be pushed manually.

  - id: credential-issue
    title: Credential issue
    type: markdown
    required: true
    guidance: >
      How the user ID and password reached the starter, who sent them, and when.

      Today this is the hiring manager emailing them. That is a manual step and it puts
      credentials in an email inbox, where they stay. Record what actually happened rather than
      what should happen — this field exists to make the practice countable, and a row of
      entries saying "emailed by the hiring manager" is the argument for changing it.
