id: recruitment-onboarding
version: 2
status: published
title: Recruitment and Onboarding
description: >
  Turning an identified vacancy into a starter who can work on their first day,
  from requisition through selection and appointment to provisioning.
stages:
  - id: requisition
    title: Requisition
    purpose: >
      Establish what the role is, how the person will be engaged, and what it
      evaluated to, as the case for recruiting. Owned by the requesting
      department. Signing this stage off is the approval to recruit.
    gate: approved-to-recruit
    modules:
      - role
      - engagement
      - role-evaluation
      - open-questions
  - id: selection
    title: Selection
    purpose: >
      Take the approved role to market, narrow the field to one preferred
      candidate, and complete pre-employment checks on them. Owned by HR.
    gate: candidate-selected
    modules:
      - role
      - advertising
      - selection
      - vetting
      - open-questions
  - id: appointment
    title: Appointment
    purpose: >
      Put the case for appointing the preferred candidate, agree and sign the
      contract, and confirm the starter can be paid. Owned by HR, with Payroll
      validating. Signing this stage off is the approval to appoint.
    gate: onboarding-approved
    modules:
      - role
      - engagement
      - selection
      - vetting
      - offer
      - contract
      - payroll
      - open-questions
  - id: provisioning
    title: Provisioning
    purpose: >
      Create the starter's identity, issue their device and access, and confirm
      they can work from their first day. Owned by Technology.
    gate: ready-to-start
    modules:
      - role
      - engagement
      - role-evaluation
      - advertising
      - selection
      - vetting
      - offer
      - contract
      - payroll
      - identity
      - device
      - access
      - handover
      - open-questions
artefacts:
  - id: requisition-brief
    title: Requisition Brief
    purpose: >
      State the role, how the person will be engaged, and what the role
      evaluated to, as the case for recruiting put to whoever signs this stage
      off.
    template: templates/requisition-brief.md.tmpl
    gate: approved-to-recruit
    requires:
      - role.summary
      - role.team
      - role.responsibilities
      - role.justification
      - engagement.type
      - engagement.term?
      - engagement.rationale
      - engagement.approval-route
      - role-evaluation.method
      - role-evaluation.outcome
      - role-evaluation.notes?
      - open-questions.questions?
    filename: "{instance.name} - Requisition Brief"
  - id: selection-report
    title: Selection Report
    purpose: >
      Record how the role was advertised, how the preferred candidate was
      chosen, and what vetting returned.
    template: templates/selection-report.md.tmpl
    gate: candidate-selected
    requires:
      - role.summary
      - advertising.channels
      - advertising.period
      - advertising.response
      - advertising.notes?
      - selection.shortlist
      - selection.interviews
      - selection.candidate-name
      - selection.rationale
      - selection.unsuccessful?
      - vetting.checks-required
      - vetting.outcome
      - vetting.conditions?
      - open-questions.questions?
    filename: "{instance.name} - Selection Report"
  - id: appointment-case
    title: Appointment Case
    purpose: >
      Present the case for appointing this candidate, and the contract and
      payroll position that releases onboarding.
    template: templates/appointment-case.md.tmpl
    gate: onboarding-approved
    requires:
      - role.summary
      - role.team
      - engagement.type
      - selection.candidate-name
      - selection.rationale
      - vetting.outcome
      - offer.terms
      - offer.status
      - offer.negotiation?
      - contract.terms-summary
      - contract.signatures
      - contract.start-date
      - contract.start-date-changes?
      - payroll.details-requested
      - payroll.validation-outcome
      - payroll.rework?
      - payroll.confirmed
      - open-questions.questions?
    filename: "{selection.candidate-name} - Appointment Case"
  - id: offer-pack
    title: Offer Pack
    purpose: >
      Set out for the appointed candidate what the role is, what was agreed, and
      what has been confirmed on their behalf.
    template: templates/offer-pack.md.tmpl
    gate: onboarding-approved
    requires:
      - role.summary
      - role.team
      - role.responsibilities
      - engagement.type
      - selection.candidate-name?
      - offer.terms
      - offer.status
      - contract.terms-summary
      - contract.signatures
      - contract.start-date
      - contract.start-date-changes?
      - payroll.details-requested
      - payroll.validation-outcome
      - payroll.confirmed
      - open-questions.questions?
    filename: "{selection.candidate-name} - Offer Pack - {contract.start-date}"
  - id: starter-readiness
    title: Starter Readiness
    purpose: >
      Record the identity, device and access provisioned for the starter and
      confirm they can work from their first day.
    template: templates/starter-readiness.md.tmpl
    gate: ready-to-start
    requires:
      - role.summary
      - selection.candidate-name?
      - contract.start-date
      - identity.account
      - identity.propagation
      - identity.credential-issue
      - device.specification
      - device.non-standard-decision?
      - device.build-status
      - access.entitlements
      - access.setup
      - access.outstanding?
      - handover.manager-actions
      - handover.day-one
      - handover.readiness-confirmation
      - open-questions.questions?
    filename: "{selection.candidate-name} - Starter Readiness - {contract.start-date}"
  - id: manager-handover
    title: Manager Handover
    purpose: >
      Tell the hiring manager what they must do before the start date and what
      is already in place.
    template: templates/manager-handover.md.tmpl
    gate: ready-to-start
    requires:
      - role.summary
      - role.team
      - selection.candidate-name?
      - contract.start-date
      - handover.manager-actions
      - handover.day-one
      - handover.readiness-confirmation
      - identity.account
      - identity.credential-issue
      - identity.propagation
      - device.specification
      - device.build-status
      - access.entitlements
      - access.setup
      - access.outstanding?
      - open-questions.questions?
    filename: "{selection.candidate-name} - Manager Handover - {today}"
  - id: hire-record
    title: Hire Record
    purpose: >
      Assemble the complete record of the hire, in process order, as the file
      that is kept.
    template: templates/hire-record.md.tmpl
    gate: ready-to-start
    requires:
      - role.summary
      - role.team
      - role.responsibilities
      - role.justification
      - engagement.type
      - engagement.term?
      - engagement.rationale
      - engagement.approval-route
      - role-evaluation.method
      - role-evaluation.outcome
      - role-evaluation.notes?
      - advertising.channels
      - advertising.period
      - advertising.response
      - advertising.notes?
      - selection.shortlist
      - selection.interviews
      - selection.candidate-name
      - selection.rationale
      - selection.unsuccessful?
      - vetting.checks-required
      - vetting.outcome
      - vetting.conditions?
      - offer.terms
      - offer.status
      - offer.negotiation?
      - contract.terms-summary
      - contract.signatures
      - contract.start-date
      - contract.start-date-changes?
      - contract.elapsed?
      - payroll.details-requested
      - payroll.validation-outcome
      - payroll.rework?
      - payroll.confirmed
      - identity.account
      - identity.propagation
      - identity.credential-issue
      - device.specification
      - device.non-standard-decision?
      - device.build-status
      - access.entitlements
      - access.setup
      - access.outstanding?
      - handover.manager-actions
      - handover.day-one
      - handover.readiness-confirmation
      - open-questions.questions?
      - open-questions.process-gaps?
    filename: "{selection.candidate-name} - Hire Record"
