id: vetting
title: Vetting
purpose: >
  Record which pre-employment checks applied to this role and what they returned.

  Record the outcome, never the particulars. "Criminal record check: cleared, 14 March" is the
  record this process needs. What a check actually surfaced is not content for a repository, and
  nothing downstream of here needs it.

fields:
  - id: checks-required
    title: Checks required
    type: select
    multiple: true
    required: true
    options:
      - Right to work
      - Criminal record
      - Credit
      - Professional registration
      - Referee checks
    guidance: >
      Which pre-employment checks apply to this role. If a check that normally applies was
      waived, say so in `conditions` below — a waiver is part of the record.

  - id: outcome
    title: Outcome
    type: select
    required: true
    options:
      - Cleared
      - Cleared with conditions
      - Not cleared
    guidance: >
      Cleared, cleared with conditions, or not cleared. The outcome only — not what any check
      returned. Record the date each check completed in `conditions` below.

  - id: conditions
    title: Conditions
    type: markdown
    required: false
    guidance: >
      Any conditions attached to clearance, who accepted them, and what must happen before or
      after the start date to satisfy them. Record the date each check completed here too, and
      note a waiver of a normally-applicable check and why it was waived.
