id: engagement
title: Engagement
purpose: >
  Record how the person will be engaged — fixed term, permanent, vendor or contractor — and
  which approval route that choice commits the request to.

  The engagement type is the first branch in the process and it is consequential: a fixed-term
  or permanent appointment takes the full approval chain, while a vendor or contractor
  engagement takes a shortened one. Classify deliberately rather than by habit; the shortened
  route is not a convenience.

fields:
  - id: type
    title: Engagement type
    type: select
    required: true
    options:
      - Fixed term
      - Permanent
      - Vendor
      - Contractor
    guidance: >
      One of fixed term, permanent, vendor or contractor. For a fixed term, vendor or
      contractor engagement, state the term or the expected duration in `term` below.

  - id: term
    title: Term or expected duration
    type: markdown
    required: false
    guidance: >
      For a fixed term, vendor or contractor engagement, state the term or the expected
      duration. Leave empty for a permanent engagement.

  - id: rationale
    title: Rationale
    type: markdown
    required: true
    guidance: >
      Why this engagement type and not another. If a contractor or vendor engagement is
      covering work that is ongoing, say so — that is a recurring pattern worth being able to
      count later. Record any delegation or variation to the standard approval route here too,
      since `approval-route` below cannot show one.

  - id: approval-route
    title: Approval route
    type: select
    required: true
    options:
      - Full approval chain
      - Shortened approval chain
    guidance: >
      Which route this engagement type commits the request to — the full approval chain, or the
      shortened chain used for vendor and contractor engagements — confirming that the route
      taken matches the type recorded above.

      The route, not the outcome. Who signed this stage off, and when, is the merged pull
      request behind the gate; nothing about it is written here.
