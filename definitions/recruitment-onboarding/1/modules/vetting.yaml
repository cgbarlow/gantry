id: vetting
title: Vetting
purpose: >
  Record which pre-employment checks applied to this role and what they returned.

  Record the outcome, never the particulars. "Criminal record check: cleared, 14 March" is the
  record this process needs. What a check actually surfaced is not content for a repository, and
  nothing downstream of here needs it.

fields:
  - id: checks-required
    title: Checks required
    type: list
    required: true
    guidance: >
      Which pre-employment checks apply to this role — right to work, criminal record,
      credit, professional registration, referee checks. If a check that normally applies was
      waived, list it and say so; a waiver is part of the record.

  - id: outcome
    title: Outcome
    type: markdown
    required: true
    guidance: >
      Cleared, cleared with conditions, or not cleared, with the date each check completed.
      The outcome only — not what any check returned.

  - id: conditions
    title: Conditions
    type: markdown
    required: false
    guidance: >
      Any conditions attached to clearance, who accepted them, and what must happen before or
      after the start date to satisfy them.
