<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Not wired into gantry's app, not linked from web/index.html.
  UI prototype for the first-class Definition Editor plan (grilling session 2026-09-14,
  phase 1 "New editor page"; decisions Q3 outline + focus pane, Q13 Library panel,
  Q17 three flat groups, Q20 live validation markers, Q21 compact field rows).

  Question this answers: what should the rebuilt Definitions page look like so that it
  minimises scrolling, keeps one thing in view at a time, and gives "pull in from another
  definition" an obvious drop surface — without overwhelming the author?

  Three structurally different variants on the real Solution Design v2 definition
  (22 modules, 4 stages, 6 artefacts — real density), switchable via ?variant=a|b|c:

    A — Workbench: three fixed panes. Outline tree | focus pane | Library panel always
        docked on the right. Definition switcher lives in the top bar as a dropdown grouped
        by home (Server / Workspace). Most direct for drag-and-drop; costs width.
    B — Two panes + drawer: definitions rail on the far left (grouped by home) that
        collapses to a breadcrumb once one is open; outline | focus pane; the Library is a
        slide-over drawer opened from "Add from…" or the toolbar. Widest focus pane; the
        Library appears only when wanted.
    C — Map + inspector: no tree. A pipeline map across the top (stages as columns of
        module chips, artefacts hanging off each gate), and a fixed-height inspector below
        for whatever is selected. The Library is a bottom tray beside the inspector.
        Spatial rather than hierarchical; shows the whole definition at once.

  In every variant: click anything to focus it; field rows are compact and one expands
  at a time; a seeded validation problem shows the marker treatment; drag a Library item
  onto a stage / artefact / module (or the outline) to see the drop affordance — the drop
  appends in memory with a "from design v2" badge. No persistence. Free-form text edits
  are not wired.

  Reuses the light-theme tokens from web/style.css (Gate Ledger design language, #69).

  VERDICT (Chris Barlow, 2026-09-14): A and C both wanted, B rejected. Shipped as one page
  with an Outline / Map view switch over the same focus pane and docked Library panel
  (Outline = A, Map = C, remembered per user). Tracked as Feature #380, phase 1 = #381.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantry — Definition Editor layout (prototype)</title>
<style>
  :root { --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif; --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --radius:2px; --hairline:1px; --border-strong:1px;
    --bg:#EDEBE6; --bg-raised:#F5F3EE; --text:#1B1E22; --text-muted:#4A4740; --line:#B9B3A4; --line-strong:#5B5648; --focus-ring:#1B1E22;
    --stamp-draft-bg:#8A5A1F; --stamp-draft-fg:#F5F1E8; --stamp-agreed-bg:#295C40; --stamp-agreed-fg:#F5F1E8; --stamp-review-bg:#4A4740; --stamp-review-fg:#F5F1E8; --stamp-error-bg:#8C3A2B; --stamp-error-fg:#F5F1E8; }
  * { box-sizing:border-box }
  html { background:var(--bg) }
  body { margin:0; font:13px/1.45 var(--font-body); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden }
  a { color:inherit }
  /* app header, mimicking the real one */
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:10px 24px; border-bottom:var(--hairline) solid var(--line); background:var(--bg-raised); flex:none }
  .app-header .brand { font:700 16px var(--font-display); letter-spacing:.02em }
  .app-header nav a { margin-left:18px; font-size:12px; color:var(--text-muted); text-decoration:none }
  .app-header nav a.current { color:var(--text); font-weight:600 }
  .proto { display:inline-block; font:700 10px var(--font-display); letter-spacing:.08em; background:var(--stamp-error-bg); color:var(--stamp-error-fg); padding:2px 7px; border-radius:var(--radius); margin-left:8px; vertical-align:middle }

  .btn { display:inline-block; font:600 12px var(--font-body); padding:6px 11px; border-radius:var(--radius); border:var(--border-strong) solid var(--line-strong); background:var(--bg-raised); color:var(--text); cursor:pointer; text-decoration:none }
  .btn.primary { background:var(--text); color:var(--bg); border-color:var(--text) }
  .btn.ghost { background:transparent; border-color:var(--line) }
  .btn.small { padding:3px 8px; font-size:11px }
  .btn:disabled { opacity:.4; cursor:not-allowed }
  .stamp { display:inline-block; padding:2px 6px; border-radius:var(--radius); font:700 9px var(--font-display); letter-spacing:.07em; vertical-align:middle; white-space:nowrap }
  .stamp.draft { background:var(--stamp-draft-bg); color:var(--stamp-draft-fg) }
  .stamp.agreed { background:var(--stamp-agreed-bg); color:var(--stamp-agreed-fg) }
  .stamp.review { background:var(--stamp-review-bg); color:var(--stamp-review-fg) }
  .stamp.error { background:var(--stamp-error-bg); color:var(--stamp-error-fg) }
  .stamp.from { background:transparent; color:var(--text-muted); border:var(--hairline) solid var(--line-strong) }
  .kicker { font:600 10px var(--font-display); letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted) }
  .mono { font:12px var(--font-mono) }
  .muted { color:var(--text-muted) }
  .problem-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--stamp-error-bg); margin-left:6px; vertical-align:middle }

  /* toolbar shared by variants */
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 20px; border-bottom:var(--hairline) solid var(--line); background:var(--bg-raised); flex:none }
  .toolbar .left, .toolbar .right { display:flex; align-items:center; gap:10px; min-width:0 }
  .toolbar .defname { font:600 14px var(--font-display); white-space:nowrap }
  .dd { position:relative }
  .dd .menu { position:absolute; top:calc(100% + 4px); left:0; min-width:260px; background:var(--bg-raised); border:var(--border-strong) solid var(--line-strong); border-radius:var(--radius); box-shadow:0 6px 18px rgba(0,0,0,.12); z-index:20; padding:6px 0 }
  .dd .menu .grp { padding:6px 12px 2px; }
  .dd .menu button { display:flex; width:100%; justify-content:space-between; gap:12px; background:none; border:0; text-align:left; padding:6px 12px; font:12px var(--font-body); cursor:pointer; color:var(--text) }
  .dd .menu button:hover { background:var(--bg) }
  .dd .menu button.sel { font-weight:600 }
  .problems { color:var(--stamp-error-bg); font-weight:600; cursor:pointer }

  /* generic pane bits */
  .pane { min-height:0; overflow:auto }
  .pane-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px; position:sticky; top:0; background:inherit; z-index:2 }
  .tree { list-style:none; margin:0; padding:0 8px 16px }
  .tree .grp { margin-top:6px }
  .tree .grp > .lbl { display:flex; justify-content:space-between; align-items:center; padding:6px 8px 3px; }
  .tree .grp > .lbl .kicker { cursor:pointer }
  .tree .node { display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .tree .node:hover { background:var(--bg) }
  .tree .node.sel { background:var(--text); color:var(--bg) }
  .tree .node.sel .problem-dot { background:var(--stamp-draft-bg) }
  .tree .node .tw { width:10px; color:var(--text-muted); font-size:10px; flex:none }
  .tree .node.sel .tw { color:var(--bg) }
  .tree .node.field { padding-left:30px; color:var(--text-muted); font-size:12px }
  .tree .node.field.sel { color:var(--bg) }
  .tree .node.drop { outline:2px dashed var(--stamp-agreed-bg); outline-offset:-2px; background:#e6efe9 }
  .tree .node .h { cursor:grab; color:var(--line-strong); font-size:12px; flex:none }

  /* focus pane content */
  .focus { padding:14px 22px 40px }
  .focus h2 { font:600 18px var(--font-display); margin:2px 0 2px; display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .focus .purpose { color:var(--text-muted); font-style:italic; margin:0 0 14px }
  .frow { display:grid; grid-template-columns:110px 1fr; gap:8px 14px; align-items:center; margin-bottom:8px }
  .frow label { font:600 11px var(--font-display); letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted) }
  .frow input, .frow textarea, .frow select { font:13px var(--font-body); padding:6px 8px; border:var(--hairline) solid var(--line-strong); border-radius:var(--radius); background:var(--bg-raised); width:100%; color:var(--text) }
  .frow textarea { min-height:52px; resize:vertical }
  .sect { margin-top:18px }
  .sect .sh { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px }
  .chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { display:inline-flex; align-items:center; gap:6px; border:var(--hairline) solid var(--line-strong); border-radius:var(--radius); padding:3px 8px; font-size:12px; background:var(--bg-raised); cursor:pointer }
  .chip .h { cursor:grab; color:var(--line-strong) }
  .chip .x { color:var(--text-muted); margin-left:2px }
  .droplist { border:var(--hairline) dashed var(--line); padding:8px; border-radius:var(--radius); min-height:38px }
  .droplist.drop { border-color:var(--stamp-agreed-bg); background:#e6efe9 }
  .rows { border-top:var(--hairline) solid var(--line) }
  .frow2 { border-bottom:var(--hairline) solid var(--line) }
  .frow2 .hd { display:flex; align-items:center; gap:8px; padding:7px 4px; cursor:pointer }
  .frow2 .hd:hover { background:var(--bg) }
  .frow2 .hd .h { cursor:grab; color:var(--line-strong) }
  .frow2 .hd .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .frow2 .hd .t .mono { color:var(--text-muted); margin-left:6px }
  .frow2.open .hd { background:var(--bg) }
  .frow2 .body { padding:8px 4px 12px 28px; background:var(--bg) }
  .reqlist .grpm { margin:8px 0 }
  .reqlist .grpm .kicker { display:block; margin-bottom:4px }
  .addrow { display:flex; gap:8px; margin-top:10px; align-items:center }

  /* library */
  .library { display:flex; flex-direction:column; min-height:0 }
  .library .src { padding:8px 12px; border-bottom:var(--hairline) solid var(--line) }
  .library .src select { width:100%; font:12px var(--font-body); padding:5px 6px; border:var(--hairline) solid var(--line-strong); border-radius:var(--radius); background:var(--bg-raised) }
  .library .search { padding:8px 12px; border-bottom:var(--hairline) solid var(--line) }
  .library .search input { width:100%; font:12px var(--font-body); padding:5px 8px; border:var(--hairline) solid var(--line); border-radius:var(--radius); background:var(--bg-raised) }
  .library .tree .node { cursor:grab }
  .library .hint { padding:8px 12px; font-size:11px; color:var(--text-muted) }

  /* floating switcher */
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#111; color:#fff; padding:8px 12px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:1000; font:600 12px var(--font-body) }
  .switcher button { background:#333; color:#fff; border:0; border-radius:999px; width:26px; height:26px; cursor:pointer; font-size:13px }
  .switcher .lbl { min-width:220px; text-align:center }

  /* ---------- Variant A: workbench ---------- */
  .va { display:grid; grid-template-columns:250px minmax(0,1fr) 270px; flex:1; min-height:0 }
  .va .outline { background:var(--bg-raised); border-right:var(--hairline) solid var(--line) }
  .va .library { background:var(--bg-raised); border-left:var(--hairline) solid var(--line) }

  /* ---------- Variant B: rail + drawer ---------- */
  .vb { display:grid; grid-template-columns:auto 260px minmax(0,1fr); flex:1; min-height:0; position:relative }
  .vb .rail { width:210px; background:var(--bg-raised); border-right:var(--hairline) solid var(--line); overflow:auto }
  .vb .rail.collapsed { width:44px }
  .vb .rail .grp { padding:10px 10px 4px }
  .vb .rail .def { display:flex; justify-content:space-between; gap:8px; padding:7px 10px; cursor:pointer; border-radius:var(--radius); align-items:center }
  .vb .rail .def:hover { background:var(--bg) }
  .vb .rail .def.sel { background:var(--text); color:var(--bg) }
  .vb .rail .def .v { font:11px var(--font-mono); color:var(--text-muted) }
  .vb .rail .def.sel .v { color:var(--bg) }
  .vb .rail .tog { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:var(--hairline) solid var(--line); padding:9px 10px; cursor:pointer; font:600 11px var(--font-display); letter-spacing:.06em; color:var(--text-muted) }
  .vb .rail.collapsed .grp, .vb .rail.collapsed .def { display:none }
  .vb .outline { background:var(--bg-raised); border-right:var(--hairline) solid var(--line) }
  .vb .drawer { position:absolute; top:0; right:0; bottom:0; width:320px; background:var(--bg-raised); border-left:var(--border-strong) solid var(--line-strong); box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(100%); transition:transform .18s ease; z-index:10; display:flex; flex-direction:column }
  .vb .drawer.open { transform:none }
  .vb .drawer .pane-head { border-bottom:var(--hairline) solid var(--line) }
  .vb .scrim { position:absolute; inset:0; background:rgba(0,0,0,.08); z-index:9; display:none }
  .vb .scrim.open { display:block }

  /* ---------- Variant C: map + inspector ---------- */
  .vc { display:grid; grid-template-rows:minmax(0,1fr) 300px; flex:1; min-height:0 }
  .vc .map { overflow:auto; padding:14px 20px; display:flex; gap:14px; align-items:flex-start }
  .vc .col { flex:0 0 220px; border:var(--hairline) solid var(--line); background:var(--bg-raised); border-radius:var(--radius); padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; max-height:100% }
  .vc .col.sel { border-color:var(--text); box-shadow:0 0 0 1px var(--text) }
  .vc .col.drop { outline:2px dashed var(--stamp-agreed-bg); outline-offset:2px }
  .vc .col .ch { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:2px 0 6px }
  .vc .col .ch .t { font:600 13px var(--font-display) }
  .vc .col .mchip { display:flex; align-items:center; gap:6px; padding:4px 6px; border:var(--hairline) solid var(--line); border-radius:var(--radius); background:var(--bg); font-size:12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .vc .col .mchip:hover { border-color:var(--line-strong) }
  .vc .col .mchip.sel { background:var(--text); color:var(--bg); border-color:var(--text) }
  .vc .col .mchip.shared { border-style:dashed }
  .vc .col .gate { margin-top:8px; padding-top:8px; border-top:var(--hairline) solid var(--line) }
  .vc .col .achip { display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:var(--radius); font-size:12px; cursor:pointer; margin-top:3px; border:var(--hairline) solid transparent }
  .vc .col .achip:hover { border-color:var(--line-strong) }
  .vc .col .achip.sel { background:var(--text); color:var(--bg) }
  .vc .col .achip.drop { outline:2px dashed var(--stamp-agreed-bg) }
  .vc .col.unused { flex-basis:200px; border-style:dashed; background:transparent }
  .vc .bottom { display:grid; grid-template-columns:minmax(0,1fr) 300px; border-top:var(--border-strong) solid var(--line-strong); min-height:0 }
  .vc .inspector { background:var(--bg-raised); overflow:auto }
  .vc .inspector .focus { padding:10px 20px 20px }
  .vc .tray { background:var(--bg-raised); border-left:var(--hairline) solid var(--line); min-height:0; display:flex; flex-direction:column }
</style>
</head>
