es-overview","proposed-solution.implications?","proposed-solution.trade-offs","risks.risk-register","security.privacy-and-confidentiality","proposed-solution.cost-benefit","proposed-solution.delivery-approach","alternatives-considered.alternatives","open-questions.questions?","hld-submission.attachments?"]},{"id":"sad","title":"Solution Architecture Document","purpose":"Describe the complete solution architecture and its requirements, security, dependencies and support handover readiness for build.","template":"templates/sad.md.tmpl","gate":"build-ready-checklist","requires":["introduction.executive-summary?","introduction.overview","introduction.purpose","introduction.in-scope","introduction.out-of-scope","design-basis.assumptions?","design-basis.constraints?","support-and-operations.stakeholders?","architecture.business-context","architecture.solution-users?","solution-definition.process-flow?","solution-definition.high-level-requirements?","architecture.solution-description","dependencies.dependencies-overview","dependencies.dependency-list","architecture.design-decisions","architecture.architectural-risks","architecture.constraints","architecture.standards","risks.open-issues","risks.risk-register","architecture.logical-components","nfrs.requirements-traceability","integration.interfaces","integration.network-and-infrastructure","integration.software-and-licences?","integration.hardware?","integration.bandwidth?","integration.network-devices?","integration.communication-and-network-protocols?","integration.san?","recovery-plan.recovery-approach","recovery-plan.resiliency?","recovery-plan.test-scenarios?","recovery-plan.raci?","nfrs.disaster-recovery-and-backup","data.logical-data-model","data.data-classification","data.data-replication","data.data-retention-and-archiving","data.data-migration","support-and-operations.environments-and-domains","security.identity-and-access","security.security-architecture","security.regulations-and-standards","security.privacy-and-confidentiality","data-security-controls.controls","data-security-controls.inheritance-and-dependencies?","support-and-operations.operational-accounts-and-licenses?","nfrs.scalability-and-capacity","nfrs.performance","nfrs.availability-and-continuity","support-and-operations.monitoring-and-alerting?","nfrs.other-nfrs","support-and-operations.decommission?","support-and-operations.support-handover-readiness","glossary.terms-and-definitions","team-and-estimates.references?"]},{"id":"ssad","title":"Solution Support Architecture Document","purpose":"Describe the solution's design and operational readiness for the teams that will support it after build.","template":"templates/ssad.md.tmpl","gate":"build-ready-checklist","requires":["architecture.logical-components","architecture.architectural-risks","risks.risk-register","risks.open-issues","introduction.executive-summary?","introduction.purpose","introduction.in-scope","introduction.out-of-scope","introduction.content-standards?","architecture.solution-description","support-and-operations.stakeholders","support-and-operations.environments-and-domains","dependencies.dependency-list","integration.interfaces","data.data-classification","nfrs.availability-and-continuity","nfrs.disaster-recovery-and-backup","nfrs.scalability-and-capacity","support-and-operations.operational-accounts-and-licenses","security.identity-and-access","security.privacy-and-confidentiality","data-security-controls.controls","data-security-controls.inheritance-and-dependencies?","support-and-operations.monitoring-and-alerting","support-and-operations.release-procedures","support-and-operations.support-handover-readiness","glossary.terms-and-definitions","team-and-estimates.references?"]},{"id":"as-built","title":"As-built","purpose":"Record what was built and the final handover information needed for operational use.","template":"templates/as-built.md.tmpl","gate":"operational-handover","requires":["glossary.terms-and-definitions","introduction.overview","introduction.purpose","introduction.in-scope","introduction.out-of-scope","design-basis.constraints?","design-basis.assumptions?","design-basis.caveats?","design-basis.design-principles?","design-basis.outcomes-and-deliverables?","as-built-notes.design-overview","as-built-notes.architecture-decisions?","as-built-notes.process-flows","as-built-notes.infrastructure-and-configuration","nfrs.disaster-recovery-and-backup","recovery-plan.recovery-approach","recovery-plan.resiliency?","recovery-plan.test-scenarios?","recovery-plan.raci?","data-security-controls.controls","data-security-controls.inheritance-and-dependencies?","as-built-notes.appendix?","as-built-notes.changes-from-design","as-built-notes.acceptance-criteria","as-built-notes.operational-notes?","as-built-notes.handover-confirmation"]}],"modules":[{"id":"alternatives-considered","title":"Alternatives considered","purpose":"Describe the other options that were on the table and why they were not chosen. Include \"do nothing\" where it helps show the proposed approach was compared, not just asserted.","fields":[{"id":"alternatives","title":"Alternatives","type":"markdown","required":true,"guidance":"For each alternative: what it was, and the specific reason it lost out to the proposed solution. \"Do nothing\" counts as an alternative and is often worth including explicitly."}]},{"id":"architecture","title":"Architecture","purpose":"Describe the solution's structure in enough detail to build from — components, layers, and the design decisions behind them. Explain what was chosen and why, and how the parts fit together.","fields":[{"id":"business-context","title":"Business context","type":"markdown","required":false,"guidance":"Describe the business processes, users and regulatory context this architecture sits within — the background the rest of this section assumes. Already approved at earlier stages — see `background` and the HLD's `proposed-solution`; do not re-derive, summarise for builders. Carries the reference SAD's \"Background\" / \"Context\" / \"Business Concept View\" / \"Wider Government Context\" sub-sections.\nKept deliberately separate from `background.problem`: the HLD frames the problem for TAC, this frames the setting for builders. Confirmed as a decision, not an oversight — see CHANGES.md."},{"id":"solution-users","title":"Solution users","type":"list","required":false,"guidance":"The roles that use this system, internal and external, each with a short description of what they do with it. The reference SAD asks for a User / Description table here and points at the requirements document's use-case model. This is the business user catalogue — the security roles and how they authenticate belong in `security.identity-and-access`, and the people to contact about the running system belong in `support-and-operations.stakeholders`."},{"id":"design-decisions","title":"Design decisions","type":"markdown","required":true,"guidance":"The decisions that shaped this architecture and why — not just what was decided, but what else was on the table. Deepen the `solution-definition.high-level-solution-overview` sketch to build-ready depth rather than starting over."},{"id":"architectural-risks","title":"Architectural risks","type":"markdown","required":false,"guidance":"Risks specific to this architecture's shape. Broader project risk belongs in the `risks` module — this is for risk that's a direct consequence of a structural choice made here."},{"id":"solution-description","title":"Solution description","type":"markdown","required":true,"guidance":"The components and how they fit together. Reference a diagram if you have one, but describe the structure in words too. Expands the `solution-definition` `high-level-solution-overview` / `process-flow` sketch — the original stays at `modules/solution-definition.md`."},{"id":"constraints","title":"Constraints and goals","type":"markdown","required":false,"guidance":"Architecture-specific constraints and goals only — the boundaries and objectives that shaped this structure (e.g. a fixed platform, a latency budget, a \"reuse existing services\" goal). Solution-wide assumptions belong in `design-basis.assumptions` (WI #331: was `introduction.assumptions`); list here only what is particular to the architecture and cross-reference that field."},{"id":"standards","title":"Applicable standards","type":"list","required":false,"guidance":"Architectural or solution standards this design follows (e.g. messaging, security, UI, development framework) — and any it deliberately departs from. Carries both the reference SAD's \"Solution Standards\" and \"Architectural Standards\" sub-sections."},{"id":"logical-components","title":"Logical components","type":"list","required":true,"guidance":"The solution's logical components, and for each, whether it's new or existing. Renders as its own section, after `risks.open-issues` — it carries the reference SAD's whole \"Logical Components View\", including its layered / product / application-usage / service-realisation viewpoints."}]},{"id":"as-built-notes","title":"As-Built Notes","purpose":"Describe what was actually built in enough detail that a skilled engineer could rebuild it. Include how it differs from the approved design and how it was shown to meet its requirements.","fields":[{"id":"design-overview","title":"Design overview","type":"markdown","required":true,"guidance":"Describe the key architecture and technology as actually implemented and how it aligns to the approved design. Reference a diagram if you have one, but describe the structure in words too."},{"id":"architecture-decisions","title":"Architecture decisions","type":"markdown","required":false,"guidance":"List the key design decisions as implemented — for each, what was decided and what it means in practice. Note any that changed from the approved design."},{"id":"process-flows","title":"Data migration and process flows","type":"markdown","required":true,"guidance":"Describe the detailed process and data flows step by step, as the system actually behaves — not the intended flows from design."},{"id":"infrastructure-and-configuration","title":"Infrastructure and configuration","type":"markdown","required":true,"guidance":"Provide environment and infrastructure detail sufficient to rebuild — services, IP addresses, ports, network configuration, resource names, roles and permissions, and equivalent build-time values."},{"id":"appendix","title":"Appendix","type":"markdown","required":false,"guidance":"Include supporting reference material that would clutter the body, such as firewall rules, test cases and the security control register."},{"id":"changes-from-design","title":"Changes from the agreed design","type":"markdown","required":true,"guidance":"Describe where the built solution diverges from the approved design and why."},{"id":"acceptance-criteria","title":"Acceptance criteria","type":"markdown","required":true,"guidance":"Detailed acceptance criteria confirming the build meets requirements — the bar a rebuild should be tested against."},{"id":"operational-notes","title":"Operational notes","type":"markdown","required":false,"guidance":"Anything a support engineer would need that isn't already captured in `support-and-operations`, the shared `recovery-plan`, or the shared `data-security-controls` module — quirks, workarounds, known limitations."},{"id":"handover-confirmation","title":"Handover confirmation","type":"markdown","required":true,"guidance":"Record who received the handover and when. Note that handover of the document does not transfer responsibility for keeping it updated."}]},{"id":"background","title":"Background and context","purpose":"Describe why this initiative exists and what it is responding to. Give a reader with no prior knowledge enough context to understand the situation quickly, stated clearly enough that a reviewer can judge the fit of the solution without inferring it.\nOne module used at SOAP and at HLD — fill it progressively: at SOAP state the current problem and the domains it touches for the business case; by HLD add the opportunity and success criteria in the depth TAC needs.","fields":[{"id":"problem","title":"Problem statement","type":"markdown","requiredAt":["business-case","hld-tac-approved"],"guidance":"The current state — what is wrong, missing, or binding right now: the legislative, operational, commercial, or technical constraint that makes this necessary. Open with a one-line summary before the fuller narrative. Describe only the present situation here; the desired end state belongs in `opportunity`.\nThe HLD's `background` framing and the SAD's `introduction` framing are intentionally separate (TAC vs Design Authority audiences) — do not expect `introduction.overview` to pre-fill from this field. See the reconciliation doc §5.\nThis field and `architecture.business-context` are also deliberately separate: the problem stated here is what TAC decides on, while the business context there is the setting a builder needs. Reviewed and confirmed as a decision in v2, not an unresolved duplicate."},{"id":"affected-domains","title":"Affected domains","type":"list","required":true,"guidance":""},{"id":"opportunity","title":"Opportunity","type":"markdown","requiredAt":["hld-tac-approved"],"guidance":"The desired future state — the better outcome, service, or capability this initiative creates once the problem is addressed. Describe what \"good\" looks like when the work is done, not how it will be built."},{"id":"success-criteria","title":"Success criteria","type":"markdown","requiredAt":["hld-tac-approved"],"guidance":"How you'll know the desired future state has actually been reached — observable, not aspirational."}]},{"id":"data-security-controls","title":"Data Security Controls","purpose":"Describe the security controls that protect the solution's data in operation and what they depend on. Cover how data is protected in transit and at rest and how access is managed.\nTwo-layer model with the shared `security` module: `security` carries the design-time posture (identity model, security architecture, regulations, privacy) and opens at high-level design; this module carries the concrete control set the solution runs under, opens at detailed design and re-opens at handover with the as-built values. There is no third home — the operational posture a support team must maintain (restricted developer access, connectivity restrictions, read-only postures) is part of this control set and the SSAD renders it from here. The Security Risk Assessment (SRA) control register itself is evidence about the built system and lives with the as-built `appendix` field. Wired into the `detailed-design` / `sad` and `handover` / `as-built` artefacts; `controls` is required at both gates (see the reconciliation doc §5).","fields":[{"id":"controls","title":"Controls","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"The security controls in force, grouped (e.g. Encryption, Incident management, Networking, Virtual machines, Availability, Access management, Application security, Documentation). For each, the concern it addresses and how it is implemented. A Service / Definition / Controls table works well.\nIncludes the controls a support team must keep true in production — developer and repository access restrictions, permitted outbound connectivity, dependency and vulnerability scanning, framework security configuration. Required at `build-ready-checklist` as designed and again at `operational-handover` as built."},{"id":"inheritance-and-dependencies","title":"Inheritance and dependencies","type":"markdown","required":false,"guidance":"What the solution's security posture inherits from an underlying platform (e.g. the cloud platform's own controls), the services relied on, data locality, and the security regulations/standards it is held to."}]},{"id":"data","title":"Data","purpose":"Describe the solution's data — what it holds, how sensitive it is, and what happens to it over its lifetime. Cover where it is stored, how long it is kept, and any movement between systems.","fields":[{"id":"logical-data-model","title":"Logical data model","type":"markdown","required":true,"guidance":"The solution's key data entities and how they relate — enough for a reader to understand what data exists without reading the schema."},{"id":"data-classification","title":"Data classification","type":"markdown","required":true,"guidance":"The sensitivity classification of the data this solution holds (e.g. personal, health, confidential), and what that classification requires of how it's handled."},{"id":"data-replication","title":"Data replication","type":"markdown","required":false,"guidance":"Where this data is copied or synchronised to (e.g. across environments, regions, or into a reporting store), and how."},{"id":"data-retention-and-archiving","title":"Data retention, archiving and records management","type":"markdown","required":true,"guidance":"How long data is kept, when/how it's archived, and any records- management obligations that apply to it."},{"id":"data-migration","title":"Data migration","type":"markdown","required":false,"guidance":"Data that needs to move from an existing system into this one, and the approach for doing so. Omit if there's nothing to migrate."}]},{"id":"dependencies","title":"Dependencies","purpose":"List what this solution depends on and what depends on it — systems, teams and decisions still in progress. This is one module used in both high-level design and detailed design — fill it progressively: during high-level design a narrative overview is enough to support the decision; the full structured dependency list is needed before build readiness.","fields":[{"id":"dependencies-overview","title":"Dependencies","type":"markdown","requiredAt":["business-case","hld-tac-approved"],"guidance":"Describe what this solution depends on and what depends on it — other initiatives, platforms, teams or decisions still in progress. Give enough for a reviewer to judge the proposal without a full dependency list yet."},{"id":"dependency-list","title":"Dependency list","type":"list","requiredAt":["build-ready-checklist"],"guidance":"Every system, service or team this solution depends on to function, and what it depends on them for — the complete list needed to build against."}]},{"id":"design-basis","title":"Design Basis","purpose":"Capture the conditions this solution was designed under — the fixed limits it had to work within, what was taken as given, qualifications a reader should carry forward, the principles used to weigh options, and what the work actually produces.\nMounted from the `shape` stage onward, immediately after `introduction`: each field here is entered once and refined at every later stage, never re-entered.","fields":[{"id":"constraints","title":"Constraints","type":"markdown","required":false,"guidance":"Fixed limits the design had to work within — deployment tooling, pre-existing infrastructure it cannot change, other in-flight work it is bound by. Capture from SOAP onward — this file re-opens at every later stage. Constraints particular to the architecture's shape belong in `architecture.constraints`."},{"id":"assumptions","title":"Assumptions","type":"markdown","required":false,"guidance":"What was taken as given for the design to hold. Things that would change the shape of the solution if they turned out false. Capture from SOAP onward — this file re-opens at every later stage, and carries the SOAP's \"Assumptions and considerations\", the Full SOAP's \"Assumptions\" and the SAD's \"Architectural Assumptions\" sections."},{"id":"caveats","title":"Caveats","type":"markdown","required":false,"guidance":"Qualifications a reader should carry into the rest of the document — e.g. a short-lived workload, a known-incomplete area, a time-bound exception. Capture from SOAP onward — this file re-opens at every later stage.\nVerified distinct from `soap-full-details.caveats`, which qualifies the *estimate* rather than the design. Evidence: the approved ATLAS design's Caveats section reads \"the migration infrastructure is expected to be a short-lived workload, with an expected life span of up to 24 months\" (a fact about the solution), while every one of the JEDI Full SOAP's eight caveats qualifies estimate reliability (\"the actual effort will differ once the IT requirements are elaborated\"). The two are not interchangeable, so both fields are kept; the Full SOAP renders only `soap-full-details.caveats`."},{"id":"design-principles","title":"Design principles","type":"markdown","required":false,"guidance":"The principles used as a guide when weighing options — e.g. common services shared where possible, least privilege, separation of concerns. A table (Ref / Principle / How it is achieved) works well."},{"id":"outcomes-and-deliverables","title":"Outcomes and deliverables","type":"markdown","required":false,"guidance":"The concrete outputs this work produces and who owns each — by phase where that helps (Design / Triage / Build / Handover)."}]},{"id":"glossary","title":"Glossary","purpose":"Define the terms, acronyms and abbreviations a reader needs to follow this document.","fields":[{"id":"terms-and-definitions","title":"Terms and definitions","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"A table of the acronyms, abbreviations and domain terms used in this solution's design and as-built documents, each with a one-line definition. The SAD, SSAD and as-built reference documents all carry this section, so it is required from `build-ready-checklist` onward — a reader unfamiliar with Contoso's systems must be able to follow the document unaided."}]},{"id":"hld-submission","title":"HLD Submission","purpose":"Provide the cover information for this submission — what is being asked, who has been consulted and what happens next.","fields":[{"id":"purpose-statement","title":"Purpose statement","type":"markdown","required":true,"guidance":"Summarise in one sentence what this document proposes and what decision is being asked for."},{"id":"authors-and-contributors","title":"Authors and contributors","type":"list","required":false,"guidance":"List who wrote or contributed to this paper — name and role (for example, \"J. Smith — Architect\"). Carries both the reference template's \"Author\" and \"Contributors\" cover rows."},{"id":"decision-requested","title":"Decision requested","type":"markdown","required":true,"guidance":"State the decision being asked for — Approve, Endorse, Discuss or Note — and a short summary of the ask."},{"id":"next-steps","title":"Next steps","type":"markdown","required":false,"guidance":"Describe where this paper goes next, if anywhere — for example, which governance step follows."},{"id":"consultation","title":"Consultation","type":"markdown","required":true,"guidance":"List who was consulted before this submission and whether they endorsed it or raised disagreement."},{"id":"attachments","title":"Attachments","type":"list","required":false,"guidance":"List any supplementary documents attached to this submission, with a name and reference or link, such as a diagram export or spreadsheet needed alongside the paper. Renders as the final section of the HLD, matching the reference template's \"Attachment/s\"."}]},{"id":"integration","title":"Integration","purpose":"Describe how this solution connects to surrounding systems and the infrastructure those connections run on. Cover interfaces, networks and hosting.\nEnvironments are not held here — see `support-and-operations.environments-and-domains`, the single environment / URL / domain list shared by the SAD and the SSAD.","fields":[{"id":"interfaces","title":"Interfaces","type":"markdown","required":true,"guidance":"The integration points themselves — protocol, direction, and what crosses the boundary."},{"id":"network-and-infrastructure","title":"Network and infrastructure architecture","type":"markdown","required":false,"guidance":"Describe the network and infrastructure the solution is deployed on and how it is reached, including hosting and sites. Keep hardware, bandwidth, network devices, protocols and storage details in the dedicated fields below."},{"id":"software-and-licences","title":"Software and licences","type":"markdown","required":false,"guidance":"The software the solution deploys and what it costs to licence — software, version, total count, and licences per environment. This is the build-time deployment inventory (the reference SAD's \"Application Software View\"). The accounts and subscriptions a support team must hold to run the solution once it is live belong in `support-and-operations.operational-accounts-and-licenses`."},{"id":"hardware","title":"Hardware","type":"markdown","required":false,"guidance":"Whether new hardware is needed and how it is sized — environment, OS / version / 32-64-bit, hypervisor, memory and CPU per guest, virtualization approach, and any licensing tied to cores or memory. Include batch-processing RAM needs where relevant."},{"id":"bandwidth","title":"Bandwidth","type":"markdown","required":false,"guidance":"Whether the current LAN / WAN / cloud network can handle the new data flows — link capacities, anticipated data volumes, and utilisation over time (e.g. MAN link, ExpressRoute circuit, AzCopy parallelism and wave sizing)."},{"id":"network-devices","title":"Network Devices","type":"markdown","required":false,"guidance":"Network devices the solution depends on or changes — DNS servers, reverse proxies, switches / routers — including IPv6 support where relevant."},{"id":"communication-and-network-protocols","title":"Communication & Network Protocols","type":"markdown","required":false,"guidance":"New logical communication paths and protocols for the solution — one row per path with environment, protocol, from / to (system or device), port, path direction (unidirectional / bidirectional), and any other comments. Only new or changed protocols, not every existing enabled one."},{"id":"san","title":"SAN (Database, Application Server, Backup, DR)","type":"markdown","required":false,"guidance":"Storage-area-network and disk requirements — database, application server, backup and DR — per environment and disk-tier type. Refer to service catalogues where relevant."}]},{"id":"introduction","title":"Overview","purpose":"Introduce the solution — what it is, why it exists, and what it covers.\nMounted from the `shape` stage onward, immediately before `design-basis`. `in-scope` / `out-of-scope` are the canonical cross-stage scope statement — entered once and refined, never re-entered. The ongoing conditions this solution was designed under (constraints, assumptions, caveats, design principles, outcomes/deliverables) live in the adjacent `design-basis` module, not here — see that module's `purpose` for why they're kept separate from this framing content.","fields":[{"id":"executive-summary","title":"Executive summary","type":"markdown","required":false,"guidance":"A standalone summary for a reader who will not read the rest of the document — what the solution is, what was decided, and what is being asked of them. The SAD and SSAD references both open with this section. Distinct from `overview`, which introduces the document's subject rather than summarising its conclusions; the SAD carries both."},{"id":"overview","title":"Overview","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"A short plain-language description of the solution and the change it delivers — enough for a reader with no prior knowledge to understand what this document is about. Also renders as the Full SOAP's opening \"Introduction\" section when filled at SOAP.\nThe HLD's `background` framing and this SAD `introduction` framing are intentionally separate (TAC vs Design Authority audiences) — do not expect this to pre-fill from `background.problem`. See the reconciliation doc §5."},{"id":"purpose","title":"Purpose","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"What this document is for and who is expected to use it (e.g. security teams for C&A sign-off, engineers to build or rebuild from)."},{"id":"in-scope","title":"In scope","type":"markdown","requiredAt":["hld-tac-approved","build-ready-checklist","operational-handover"],"guidance":"The features, functionality, and deliverables inside the boundaries of this design. This is the canonical scope statement — it re-opens and is refined at every later stage."},{"id":"out-of-scope","title":"Out of scope","type":"markdown","requiredAt":["hld-tac-approved","build-ready-checklist","operational-handover"],"guidance":"What this design explicitly does not cover. Silence on out-of-scope is the most common cause of a design being sent back with questions."},{"id":"content-standards","title":"Content standards","type":"markdown","required":false,"guidance":"Conventions a reader needs to interpret this document — e.g. that diagrams are collated from several parties and so vary in style, which notation is used, or how this document relates to the fuller SAD. Only the SSAD renders this field (the \"Content Standards\" sub-section of the FV Help Tool SSAD's Introduction); the SAD and as-built templates leave it out, so filling it does not affect them."}]},{"id":"nfrs","title":"Non-Functional Requirements","purpose":"Describe the quality attributes the solution must meet, such as performance, availability and scalability. State the targets clearly enough to design and test against. This is one module used in both high-level design and detailed design — fill it progressively: during high-level design include only the NFRs that shape that decision; before build readiness it should be complete enough to design and test against.\nFor concrete operational controls (encryption, networking, incident management) see `data-security-controls.controls` — this module carries the targets, not the control set.","fields":[{"id":"scalability-and-capacity","title":"Scalability and capacity","type":"markdown","requiredAt":["build-ready-checklist"],"guidance":""},{"id":"performance","title":"Performance","type":"markdown","requiredAt":["hld-tac-approved","build-ready-checklist"],"guidance":"Keep this to a headline target at high-level design — the TAC reference template asks only for the performance requirements that bear on the decision. Deepen to testable figures before build readiness."},{"id":"availability-and-continuity","title":"Availability and continuity","type":"markdown","requiredAt":["hld-tac-approved","build-ready-checklist"],"guidance":"Keep this to a headline target at high-level design; deepen to a testable availability target and continuity approach before build readiness."},{"id":"disaster-recovery-and-backup","title":"Disaster recovery and backup","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"The recovery *targets*, and only the targets: recovery time and point objectives, the scenarios that would satisfy them, backup type, method, schedule and retention, and the archiving policy. This field owns RTO and RPO — state them here once and reference them from `recovery-plan`.\nThe recovery *mechanism* that meets these targets (failover model, resiliency design, tested scenarios, RACI) belongs in the `recovery-plan` module. Both render under the single \"Failure and recovery\" section, so state each fact in one place only. Carried through to handover so the as-built recovery plan can be read against the targets it was built to."},{"id":"other-nfrs","title":"Other non-functional requirements","type":"markdown","required":false,"guidance":"Anything that doesn't fit the categories above but still constrains the solution — accessibility, Te Tiriti obligations, data sovereignty, compliance-driven quality attributes, contractual obligations, or future-considerations notes. End-of-life commitments are not an NFR; they belong in `support-and-operations.decommission`."},{"id":"requirements-traceability","title":"Requirements traceability","type":"markdown","requiredAt":["build-ready-checklist"],"guidance":"Describe how the design maps back to the agreed functional and non-functional requirements — enough for a reviewer to check nothing was quietly dropped. Map back to `solution-definition.high-level-requirements`, the agreed set captured at SOAP, rather than restating the requirements here. You can keep this light during high-level design; it should be complete before build readiness."}]},{"id":"open-questions","title":"Open Questions","purpose":"List the questions that are still open and what needs to happen to resolve them.\nOpen from the `shape` stage onward: the Full SOAP's \"Questions\" section and the HLD's \"Open questions\" section render from this one field, so a question raised at SOAP carries into the HLD rather than being re-typed.","fields":[{"id":"questions","title":"Open questions","type":"markdown","required":false,"guidance":"List each open question, who needs to resolve it and when it needs resolving. Questions that mature into risks migrate to `risks` (`open-issues` -> `risk-register`) at detailed design."}]},{"id":"proposed-solution","title":"Proposed Solution","purpose":"Describe the proposed solution and why it is the right choice. Cover how it aligns with strategy, its costs and benefits, implications and what you are trading off.\nThe solution's shape itself is not re-entered here — the `hld` artefact renders `solution-definition.high-level-solution-overview` from SOAP as the section's opening. Deepen or correct that sketch there rather than restating it.","fields":[{"id":"guardrails","title":"Guardrails","type":"markdown","required":true,"guidance":"List which guardrails this solution follows. If it seeks an exemption or introduces a new guardrail, say so explicitly."},{"id":"strategy-alignment","title":"Alignment with strategy","type":"markdown","required":true,"guidance":"Builds on the SOAP sketch — see `solution-definition` (`high-level-solution-overview`, `feature-breakdown`). Do not re-derive; show how that shape aligns with strategy for TAC."},{"id":"implications","title":"Implications","type":"markdown","required":false,"guidance":""},{"id":"trade-offs","title":"Trade-offs","type":"markdown","required":true,"guidance":"What you're giving up by choosing this solution over the alternatives recorded in `alternatives-considered` (seeded by `solution-definition.alternatives-sketch` at SOAP)."},{"id":"cost-benefit","title":"Cost-benefit analysis","type":"markdown","required":true,"guidance":"Cost versus benefit, including recurring costs and non-monetary comparisons (e.g. person-hours saved) where a dollar figure isn't meaningful. Start from `team-and-estimates.estimates` — refine, don't restate."},{"id":"delivery-approach","title":"Delivery approach and indicative timeline","type":"markdown","required":true,"guidance":"Traceable to `team-and-estimates.estimates` — refine the SOAP T-shirt sizes into an indicative timeline rather than re-deriving them."}]},{"id":"recovery-plan","title":"Recovery Plan","purpose":"Describe how the solution recovers from failure — how it fails over, how it stays resilient, what has been tested and who is responsible.","fields":[{"id":"recovery-approach","title":"Recovery approach","type":"markdown","requiredAt":["build-ready-checklist","operational-handover"],"guidance":"The failover model for each layer of the solution (platform, workloads) — active-active vs active-passive, the availability tier, and the tool used to redeploy on failover. Reference the recovery targets in `nfrs.disaster-recovery-and-backup` rather than restating RTO/RPO here: this field describes how the solution meets them."},{"id":"resiliency","title":"Resiliency","type":"markdown","required":false,"guidance":"How the solution stays available through a zone or component failure — redundancy, availability zones, network/peering design."},{"id":"test-scenarios","title":"Test scenarios","type":"markdown","required":false,"guidance":"The recovery scenarios that are tested, the failover type for each, and a link to the technical recovery plan / runbook that covers it."},{"id":"raci","title":"RACI","type":"markdown","required":false,"guidance":"Who is Responsible, Accountable, Consulted and Informed for each recovery and ongoing-support task."}]},{"id":"risks","title":"Risks","purpose":"List the risks to delivering and operating this solution and how each will be mitigated. Include who owns each risk and its likelihood and impact before and after mitigation. This is one module used in both high-level design and detailed design — fill it progressively: during high-level design include the risks that could affect that decision; before build readiness include the fuller register needed to build against.","fields":[{"id":"risk-register","title":"Risks and mitigations","type":"markdown","required":true,"guidance":"Each risk with an owner, its likelihood/impact, its mitigation, and — where a mitigation is already underway — the current risk rating versus the projected rating once the mitigation lands. Not just a list of concerns with no response attached."},{"id":"open-issues","title":"Open issues","type":"markdown","required":false,"guidance":"List unresolved issues that are not yet risks with a clear mitigation but need tracking before the design is approved for build."}]},{"id":"security","title":"Security","purpose":"Describe the solution's security and privacy posture — how users are authenticated and authorised, the security architecture and the regulations and standards that apply. This is one module used in both high-level design and detailed design — fill it progressively: during high-level design include the security implications that inform that decision; before build readiness include the full posture needed to build against.\nDesign-time claims (who can do what, threat model, regulations). For the concrete controls the built solution runs under (encryption, networking, incident management) use `data-security-controls.controls`; for the posture a support team must keep true in production use `support-and-operations.operational-security-controls`.","fields":[{"id":"identity-and-access","title":"Identity and access management","type":"markdown","requiredAt":["build-ready-checklist"],"guidance":"Authentication, authorisation, and the security roles involved. Carries the reference SAD's \"Identity & Access Management\", \"Security Roles\", \"Authentication\" and \"User Roles\" sub-sections."},{"id":"security-architecture","title":"Security architecture","type":"markdown","requiredAt":["build-ready-checklist"],"guidance":"Goals, constraints and assumptions specific to security — not a restatement of the general architecture."},{"id":"regulations-and-standards","title":"Regulations and standards","type":"list","requiredAt":["build-ready-checklist"],"guidance":"The regulations and standards this solution is held to, including the acts and regulations that govern the business process it supports."},{"id":"privacy-and-confidentiality","title":"Privacy and confidentiality concerns","type":"markdown","requiredAt":["hld-tac-approved","build-ready-checklist"],"guidance":"Whether the solution affects anyone's personal information, and any privacy or confidentiality concern it raises. State this at high-level design in enough depth for TAC to judge whether a security assessment is needed; deepen before build readiness."}]},{"id":"soap-full-details","title":"Full SOAP Details","purpose":"Provide the supporting details that complete the fuller summary — dates, sequencing and estimate caveats — without repeating content held elsewhere.","fields":[{"id":"epic-project","title":"Epic/Project","type":"markdown","required":false,"guidance":"Name or identifier of the Epic or project this SOAP and estimate belong to."},{"id":"requested-lead-by","title":"Requested/lead by","type":"markdown","required":false,"guidance":"The person or group that requested the work and, where known, the lead accountable for shaping it."},{"id":"request-date","title":"Request date","type":"markdown","required":false,"guidance":"The date the SOAP or estimate was requested. Use the date format your organisation uses consistently."},{"id":"draft-agreed-date","title":"Draft agreed date","type":"markdown","required":false,"guidance":"The date the draft SOAP or estimate was agreed for circulation or review."},{"id":"delivered-date","title":"SOAP/estimate delivered date","type":"markdown","required":false,"guidance":"The date the SOAP or estimate was delivered to its intended audience."},{"id":"sequencing","title":"Sequencing","type":"markdown","required":false,"guidance":"A possible sequence based on the estimates, not a commitment of team capacity. Use a markdown table with exactly `Requirement`, `Team`, `Estimate`, and `Notes` columns."},{"id":"caveats","title":"Caveats","type":"markdown","required":false,"guidance":"The standing caveats that qualify a high-level estimate — what the figures do and do not account for. Defaults to the JEDI Full SOAP template's eight caveat bullets; edit only if an initiative needs to add or vary one. Qualifications about the design rather than the estimate belong in `design-basis.caveats`, which carries forward to the SAD and as-built."}]},{"id":"solution-definition","title":"Solution Definition","purpose":"Outline what the solution is and how it will work end to end, at a level that shows the shape without committing to the full architecture. Include the key requirements, process flow and who delivers each part.","fields":[{"id":"high-level-requirements","title":"High-level requirements","type":"markdown","required":true,"guidance":"The high-level requirements this solution must address. Use a markdown table with `Section` and `Requirement` columns when the work has several requirement groups; keep each requirement brief but specific enough to define the expected functionality and its scope. This is the agreed set that `nfrs.requirements-traceability` maps back to at detailed design — capture it here so nothing agreed can be quietly dropped."},{"id":"process-flow","title":"Process flow","type":"markdown","required":true,"guidance":"How work or data moves through the solution, step by step. A narrative walk-through is fine; a diagram reference is fine too, but describe what the diagram shows in words as well. Reused and deepened at `architecture.solution-description` — write the SOAP-level flow once."},{"id":"high-level-solution-overview","title":"High level solution overview","type":"markdown","required":true,"guidance":"The shape of the solution in outline — the main components and how they relate. This is a sketch, not the Detailed Design stage's `architecture` module; go only as deep as a SOAP-stage reader needs."},{"id":"feature-breakdown","title":"Feature breakdown and involved teams","type":"markdown","required":true,"guidance":"The solution broken into the features or workstreams that deliver it, and which teams are involved in each."},{"id":"alternatives-sketch","title":"Alternatives sketch","type":"markdown","required":false,"guidance":"Brief alternative(s) considered at SOAP, including \"do nothing\" — expanded at `modules/alternatives-considered.md` for TAC; do not re-derive there."}]},{"id":"support-and-operations","title":"Support and Operations","purpose":"Describe what a support team needs to operate and hand over this solution — who to contact, where it runs, how it is released and what 'ready to hand over' means.","fields":[{"id":"stakeholders","title":"Stakeholders and support contacts","type":"list","required":true,"guidance":"Who owns this solution operationally once it's live, who to contact for each part of it, and the escalation path/support map between them — not just a flat contact list. Also carries the reference SAD's \"Stakeholder Mapping\" sub-section."},{"id":"environments-and-domains","title":"Environments, URLs and domains","type":"list","required":true,"guidance":"Every environment this solution runs in, and the URLs/domains (including redirects) associated with each. This is the single environment list — the SAD's \"Environments\" section and the SSAD's \"Solution Domains\" / \"URL's, Domains and redirections\" sections both render from here, so enter it once."},{"id":"operational-accounts-and-licenses","title":"Operational accounts and licenses","type":"list","required":false,"guidance":"Third-party accounts, subscriptions or licenses the support team must hold to operate this solution once it's live (e.g. a CI provider, a hosted API) — distinct from the build-time dependencies in `integration`. Carries the reference SAD's \"Terms & Conditions and Contracts\" sub-section."},{"id":"monitoring-and-alerting","title":"Monitoring and alerting","type":"markdown","required":false,"guidance":"What's monitored once this solution is live — dashboards, alert thresholds (e.g. request volume, 4xx/5xx rates) — and who gets notified when they trip. Carries the reference SAD's \"Systems Management & Monitoring\" sub-section."},{"id":"release-procedures","title":"Release procedures","type":"markdown","required":false,"guidance":""},{"id":"support-handover-readiness","title":"Support handover readiness","type":"markdown","required":true,"guidance":"What \"ready to hand over to support\" means for this solution specifically — what the support team needs in hand before they own it."},{"id":"decommission","title":"Decommission","type":"markdown","required":false,"guidance":"What happens at end of life — who turns the solution off, what becomes of its data, which accounts, licences and contracts end, and any notice period. Cross-reference `data.data-retention-and-archiving` for what must be kept after the service stops."}]},{"id":"team-and-estimates","title":"Teams, contact persons, and high-level estimates","purpose":"List the teams involved and the order-of-magnitude sizing for the work. This is a signal for planning, not a commitment.","fields":[{"id":"teams-required","title":"Teams required","type":"list","required":true,"guidance":"Every team touched by this solution and a named contact for each — not just the obvious delivery team."},{"id":"estimates","title":"Estimates","type":"markdown","required":true,"guidance":"T-shirt size (or equivalent order-of-magnitude estimate) per team or workstream. This is a sizing signal for planning, not a commitment."},{"id":"references","title":"References","type":"list","required":false,"guidance":"Links to supporting material — prior art, related initiatives, source documents, or the sizing methodology used for `estimates` — that informed this instance but don't belong inline."}]}]}</script>
<script>
// ------------------------------------------------------------------ data + state
const DESIGN = JSON.parse(document.getElementById('data').textContent)
// A second, small definition so the Library and the rail have something real to switch between.
const PROCUREMENT = { id: 'procurement', version: 1, status: 'draft', title: 'Procurement', home: 'workspace',
  stages: [{ id: 'shape', title: 'Shape the need', gate: 'business-case', purpose: 'Frame the buying need.', modules: ['background', 'risks'] }],
  artefacts: [{ id: 'soap', title: 'Procurement on a Page', gate: 'business-case', template: 'templates/soap.md.tmpl', purpose: '', requires: ['background.problem', 'risks.risk-register'] }],
  modules: [
    { id: 'background', title: 'Background', purpose: 'Why are we buying?', fields: [{ id: 'problem', title: 'Problem', type: 'markdown', required: true, guidance: 'The need in one paragraph.' }, { id: 'sponsor', title: 'Sponsor', type: 'markdown', guidance: 'Who owns the budget.' }] },
    { id: 'risks', title: 'Procurement risks', purpose: '', fields: [{ id: 'risk-register', title: 'Risk register', type: 'markdown', required: true, guidance: '' }, { id: 'appetite', title: 'Risk appetite', type: 'markdown', guidance: '' }] },
  ] }
const HOMES = [
  { home: 'Server library', defs: [{ ...DESIGN, home: 'server' }, { id: 'design', version: 3, status: 'draft', title: 'Solution Design', home: 'server', stages: DESIGN.stages, artefacts: DESIGN.artefacts, modules: DESIGN.modules }] },
  { home: 'Workspace · Kiwi Cover Mutual', defs: [PROCUREMENT] },
]
const clone = (x) => JSON.parse(JSON.stringify(x))
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const byId = (l, id) => l.find((x) => x.id === id)

// editing state (in memory). Start on the design v3 draft so Edit affordances show.
let S = {
  def: clone(HOMES[0].defs[1]),
  sel: { type: 'stage', id: 'shape' },       // focused element
  openField: null,                            // field row expanded in a module pane
  collapsed: { stages: false, artefacts: false, modules: false },
  openModules: new Set(['risks']),           // outline: which module nodes show fields
  libSource: 'procurement',
  libOpen: false,                             // variant B drawer
  railCollapsed: true,                        // variant B rail
  ddOpen: false,
  drop: null,                                 // current drop target key
}
// seeded validation problem to show the marker treatment
const PROBLEMS = [{ where: { type: 'artefact', id: 'hld' }, text: 'hld requires "nfrs.capacity", which is not a field of nfrs' }]
const hasProblem = (type, id) => PROBLEMS.some((p) => p.where.type === type && p.where.id === id)
const libDef = () => HOMES.flatMap((h) => h.defs).find((d) => d.id === S.libSource) || PROCUREMENT

// ------------------------------------------------------------------ shared fragments
function stampStatus(d) { return d.status === 'published' ? `<span class="stamp agreed">PUBLISHED v${d.version}</span>` : `<span class="stamp draft">DRAFT v${d.version}</span>` }

function toolbar(extraLeft = '', extraRight = '') {
  const d = S.def
  return `<div class="toolbar">
    <div class="left">${extraLeft}
      <div class="dd"><button class="btn ghost" onclick="tog('ddOpen')"><span class="defname">${esc(d.title)}</span> <span class="mono muted">${esc(d.id)}</span> ▾</button>
        ${S.ddOpen ? `<div class="menu">${HOMES.map((h) => `<div class="grp kicker">${esc(h.home)}</div>${h.defs.map((x) => `<button class="${x.id === d.id && x.version === d.version ? 'sel' : ''}" onclick="pickDef('${x.id}',${x.version})"><span>${esc(x.title)} <span class="mono muted">${esc(x.id)}</span></span>${stampStatus(x)}</button>`).join('')}`).join('')}<div class="grp"><button onclick="alert('New definition: Blank or Clone (not wired)')">+ New definition…</button></div></div>` : ''}
      </div>
      ${stampStatus(d)}
      ${PROBLEMS.length ? `<span class="problems" onclick="sel('${PROBLEMS[0].where.type}','${PROBLEMS[0].where.id}')">● ${PROBLEMS.length} problem</span>` : `<span class="muted">No problems</span>`}
    </div>
    <div class="right">${extraRight}<span class="muted">Unsaved changes</span><button class="btn">Discard</button><button class="btn primary">Save</button><button class="btn" ${d.status === 'draft' ? '' : 'disabled'}>Publish…</button></div>
  </div>`
}

function outlineTree(d, { droppable = true } = {}) {
  const node = (type, id, label, extra = '', cls = '') => {
    const s = S.sel.type === type && S.sel.id === id
    const dropAttr = droppable && (type === 'stage' || type === 'artefact' || type === 'module') ? ` ondragover="dragOver(event,'${type}:${id}')" ondragleave="dragLeave(event,'${type}:${id}')" ondrop="drop(event,'${type}','${id}')"` : ''
    return `<div class="node ${cls} ${s ? 'sel' : ''} ${S.drop === type + ':' + id ? 'drop' : ''}" draggable="true" ondragstart="dragStartInternal(event,'${type}','${id}')" onclick="sel('${type}','${id}')"${dropAttr}>${extra}<span class="h">⠿</span><span>${esc(label)}</span>${hasProblem(type, id) ? '<span class="problem-dot"></span>' : ''}</div>`
  }
  const grp = (key, title, body, count) => `<li class="grp"><div class="lbl"><span class="kicker" onclick="tog('collapsed.${key}')">${S.collapsed[key] ? '▸' : '▾'} ${title} <span class="muted">${count}</span></span><button class="btn small ghost" onclick="addNew('${key}')">+</button></div>${S.collapsed[key] ? '' : body}</li>`
  return `<ul class="tree">
    ${grp('stages', 'Stages', d.stages.map((s) => node('stage', s.id, s.title)).join(''), d.stages.length)}
    ${grp('artefacts', 'Artefacts', d.artefacts.map((a) => node('artefact', a.id, a.title)).join(''), d.artefacts.length)}
    ${grp('modules', 'Modules', d.modules.map((m) => {
      const open = S.openModules.has(m.id)
      return node('module', m.id, m.title, `<span class="tw" onclick="event.stopPropagation();togModule('${m.id}')">${open ? '▾' : '▸'}</span>`) +
        (open ? m.fields.map((f) => `<div class="node field ${S.sel.type === 'field' && S.sel.id === m.id + '.' + f.id ? 'sel' : ''}" onclick="selField('${m.id}','${f.id}')">· ${esc(f.title)}</div>`).join('') : '')
    }).join(''), d.modules.length)}
  </ul>`
}

function libraryPanel({ compact = false } = {}) {
  const src = libDef()
  const opts = HOMES.map((h) => `<optgroup label="${esc(h.home)}">${h.defs.filter((x) => !(x.id === S.def.id && x.version === S.def.version)).map((x) => `<option value="${x.id}" ${x.id === S.libSource ? 'selected' : ''}>${esc(x.title)} v${x.version} (${x.status})</option>`).join('')}</optgroup>`).join('')
  const node = (kind, id, label, sub = '') => `<div class="node" draggable="true" ondragstart="dragStartLib(event,'${kind}','${id}')" title="Drag onto your outline, or double-click to add"><span class="h">⠿</span><span>${esc(label)}</span>${sub}</div>`
  return `<div class="library pane">
    <div class="pane-head"><span class="kicker">Library</span>${compact ? '' : '<span class="muted" style="font-size:11px">drag to copy</span>'}</div>
    <div class="src"><select onchange="S.libSource=this.value;render()">${opts}</select></div>
    <div class="search"><input placeholder="Filter elements…"></div>
    <ul class="tree">
      <li class="grp"><div class="lbl"><span class="kicker">Stages</span></div>${src.stages.map((s) => node('stage', s.id, s.title)).join('')}</li>
      <li class="grp"><div class="lbl"><span class="kicker">Artefacts</span></div>${src.artefacts.map((a) => node('artefact', a.id, a.title)).join('')}</li>
      <li class="grp"><div class="lbl"><span class="kicker">Modules</span></div>${src.modules.map((m) => node('module', m.id, m.title) + m.fields.map((f) => `<div class="node field" draggable="true" ondragstart="dragStartLib(event,'field','${m.id}.${f.id}')">· ${esc(f.title)}</div>`).join('')).join('')}</li>
    </ul>
    <div class="hint">Copies are independent and carry a "from ${esc(src.id)} v${src.version}" badge. Stages and artefacts bring any modules you lack, after a confirm.</div>
  </div>`
}

// ------------------------------------------------------------------ focus pane content
function focusPane(d) {
  const { type, id } = S.sel
  if (type === 'stage') {
    const s = byId(d.stages, id); if (!s) return ''
    return `<div class="focus">
      <span class="kicker">Stage</span>
      <h2>${esc(s.title)} ${from(s)}</h2>
      <div class="frow"><label>Id</label><input class="mono" value="${esc(s.id)}"><label>Title</label><input value="${esc(s.title)}"><label>Gate</label><input class="mono" value="${esc(s.gate)}"><label>Purpose</label><textarea>${esc(s.purpose)}</textarea></div>
      <div class="sect"><div class="sh"><span class="kicker">Modules in this stage · ${s.modules.length}</span><span class="muted" style="font-size:11px">drag to reorder · drop a module here to add it</span></div>
        <div class="droplist ${S.drop === 'stage:' + s.id ? 'drop' : ''}" ondragover="dragOver(event,'stage:${s.id}')" ondragleave="dragLeave(event,'stage:${s.id}')" ondrop="drop(event,'stage','${s.id}')">
          <div class="chips">${s.modules.map((m) => `<span class="chip" onclick="sel('module','${m}')"><span class="h">⠿</span>${esc(byId(d.modules, m)?.title ?? m)}<span class="x">×</span></span>`).join('')}</div>
        </div>
        <div class="addrow"><button class="btn small" onclick="alert('picker (not wired)')">+ Add module</button><button class="btn small ghost" onclick="openLib()">From another definition…</button></div>
      </div>
      <div class="sect"><span class="kicker">Artefacts at this gate</span><div class="chips" style="margin-top:6px">${d.artefacts.filter((a) => a.gate === s.gate).map((a) => `<span class="chip" onclick="sel('artefact','${a.id}')">${esc(a.title)}</span>`).join('') || '<span class="muted">none</span>'}</div></div>
    </div>`
  }
  if (type === 'artefact') {
    const a = byId(d.artefacts, id); if (!a) return ''
    const groups = {}
    for (const r of a.requires) { const [m, f] = r.replace(/\?$/, '').split('.'); (groups[m] ||= []).push({ f, opt: r.endsWith('?') }) }
    return `<div class="focus">
      <span class="kicker">Artefact</span>
      <h2>${esc(a.title)} ${from(a)} ${hasProblem('artefact', a.id) ? '<span class="stamp error">1 PROBLEM</span>' : ''}</h2>
      ${hasProblem('artefact', a.id) ? `<p style="color:var(--stamp-error-bg);margin:0 0 10px">● ${esc(PROBLEMS[0].text)}</p>` : ''}
      <div class="frow"><label>Id</label><input class="mono" value="${esc(a.id)}"><label>Title</label><input value="${esc(a.title)}"><label>Gate</label><input class="mono" value="${esc(a.gate)}"><label>Template</label><div><span class="mono">${esc(a.template)}</span> <button class="btn small ghost">Edit template</button> <span class="mono muted">${esc(a.template.replace('.md.tmpl', '.docx').replace('templates/', 'reference-'))}</span> <button class="btn small ghost">Replace</button></div></div>
      <div class="sect"><div class="sh"><span class="kicker">Requires · ${a.requires.length} fields in ${Object.keys(groups).length} modules</span><span class="muted" style="font-size:11px">order = document outline · drop a module or field here</span></div>
        <div class="droplist reqlist ${S.drop === 'artefact:' + a.id ? 'drop' : ''}" ondragover="dragOver(event,'artefact:${a.id}')" ondragleave="dragLeave(event,'artefact:${a.id}')" ondrop="drop(event,'artefact','${a.id}')">
          ${Object.entries(groups).map(([m, fs]) => `<div class="grpm"><span class="kicker" onclick="sel('module','${m}')" style="cursor:pointer">${esc(byId(d.modules, m)?.title ?? m)}${byId(d.modules, m) ? '' : ' <span class="stamp error">MISSING</span>'}</span><div class="chips">${fs.map((x) => `<span class="chip ${x.opt ? 'ghost' : ''}" title="${x.opt ? 'optional in scope' : 'required'}"><span class="h">⠿</span>${esc(x.f)}${x.opt ? ' <span class="muted">?</span>' : ''}<span class="x">×</span></span>`).join('')}</div></div>`).join('')}
        </div>
        <div class="addrow"><button class="btn small">+ Add requirement</button><button class="btn small ghost" onclick="openLib()">From another definition…</button></div>
      </div>
    </div>`
  }
  if (type === 'module' || type === 'field') {
    const mid = type === 'module' ? id : id.split('.')[0]
    const m = byId(d.modules, mid); if (!m) return ''
    const used = d.stages.filter((s) => s.modules.includes(m.id)), usedA = d.artefacts.filter((a) => a.requires.some((r) => r.replace(/\?$/, '').split('.')[0] === m.id))
    return `<div class="focus">
      <span class="kicker">Module</span>
      <h2>${esc(m.title)} ${from(m)}</h2>
      <p class="purpose">${esc(m.purpose)}</p>
      <div class="frow"><label>Id</label><input class="mono" value="${esc(m.id)}"><label>Title</label><input value="${esc(m.title)}"></div>
      <div class="sect"><span class="kicker">Used in</span> <span class="chips" style="display:inline-flex;margin-left:6px">${used.map((s) => `<span class="chip" onclick="sel('stage','${s.id}')">${esc(s.title)}</span>`).join('')}${usedA.map((a) => `<span class="chip ghost" onclick="sel('artefact','${a.id}')">${esc(a.title)}</span>`).join('')}</span></div>
      <div class="sect"><div class="sh"><span class="kicker">Fields · ${m.fields.length}</span><span class="muted" style="font-size:11px">click a row to edit it · drag to reorder · drop a field here to add</span></div>
        <div class="rows droplist ${S.drop === 'module:' + m.id ? 'drop' : ''}" style="padding:0" ondragover="dragOver(event,'module:${m.id}')" ondragleave="dragLeave(event,'module:${m.id}')" ondrop="drop(event,'module','${m.id}')">
          ${m.fields.map((f) => fieldRow(m, f)).join('')}
        </div>
        <div class="addrow"><button class="btn small">+ Add field</button><button class="btn small ghost" onclick="openLib()">From another definition…</button></div>
      </div>
    </div>`
  }
  return ''
}
function from(x) { return x.copiedFrom ? `<span class="stamp from">from ${esc(x.copiedFrom.definition)} v${x.copiedFrom.version}</span>` : '' }
function fieldRow(m, f) {
  const open = S.openField === m.id + '.' + f.id
  const req = f.required ? '<span class="stamp review">REQUIRED</span>' : f.requiredAt ? `<span class="stamp review" title="${esc(f.requiredAt.join(', '))}">REQUIRED AT ${f.requiredAt.length}</span>` : '<span class="muted" style="font-size:11px">optional</span>'
  return `<div class="frow2 ${open ? 'open' : ''}"><div class="hd" onclick="togField('${m.id}','${f.id}')"><span class="h">⠿</span><span class="t">${esc(f.title)}<span class="mono">${esc(f.id)}</span> ${from(f)}</span><span class="mono muted">${esc(f.type)}</span>${req}</div>
    ${open ? `<div class="body"><div class="frow"><label>Id</label><input class="mono" value="${esc(f.id)}"><label>Title</label><input value="${esc(f.title)}"><label>Type</label><select><option ${f.type === 'markdown' ? 'selected' : ''}>markdown</option><option ${f.type === 'list' ? 'selected' : ''}>list</option></select><label>Required</label><select><option ${!f.required && !f.requiredAt ? 'selected' : ''}>optional</option><option ${f.required ? 'selected' : ''}>always</option><option ${f.requiredAt ? 'selected' : ''}>at gates…</option></select><label>Guidance</label><textarea>${esc(f.guidance)}</textarea></div><button class="btn small ghost">Remove field</button></div>` : ''}
  </div>`
}

// ------------------------------------------------------------------ variants
function VariantA() {
  return toolbar() + `<div class="va">
    <div class="outline pane"><div class="pane-head"><span class="kicker">Outline</span></div>${outlineTree(S.def)}</div>
    <div class="pane" style="background:var(--bg)">${focusPane(S.def)}</div>
    ${libraryPanel()}
  </div>`
}
VariantA.title = 'Workbench: three fixed panes'

function VariantB() {
  const rail = `<div class="rail ${S.railCollapsed ? 'collapsed' : ''}"><button class="tog" onclick="tog('railCollapsed')">${S.railCollapsed ? '▸' : '◂ DEFINITIONS'}</button>
    ${HOMES.map((h) => `<div class="grp kicker">${esc(h.home)}</div>${h.defs.map((x) => `<div class="def ${x.id === S.def.id && x.version === S.def.version ? 'sel' : ''}" onclick="pickDef('${x.id}',${x.version})"><span>${esc(x.title)}</span><span class="v">v${x.version} ${x.status === 'draft' ? '✎' : ''}</span></div>`).join('')}`).join('')}
    <div class="grp"><button class="btn small ghost">+ New definition…</button></div></div>`
  return toolbar('', `<button class="btn ghost" onclick="tog('libOpen')">Library ▸</button>`) + `<div class="vb">
    ${rail}
    <div class="outline pane"><div class="pane-head"><span class="kicker">Outline</span></div>${outlineTree(S.def)}</div>
    <div class="pane" style="background:var(--bg)">${focusPane(S.def)}</div>
    <div class="scrim ${S.libOpen ? 'open' : ''}" onclick="S.libOpen=false;render()"></div>
    <div class="drawer ${S.libOpen ? 'open' : ''}"><div class="pane-head"><span class="kicker">Add from another definition</span><button class="btn small ghost" onclick="S.libOpen=false;render()">Close</button></div>${libraryPanel({ compact: true })}</div>
  </div>`
}
VariantB.title = 'Rail + outline, Library as drawer'

function VariantC() {
  const d = S.def
  const usedIds = new Set(d.stages.flatMap((s) => s.modules))
  const cols = d.stages.map((s) => {
    const selC = S.sel.type === 'stage' && S.sel.id === s.id
    return `<div class="col ${selC ? 'sel' : ''} ${S.drop === 'stage:' + s.id ? 'drop' : ''}" ondragover="dragOver(event,'stage:${s.id}')" ondragleave="dragLeave(event,'stage:${s.id}')" ondrop="drop(event,'stage','${s.id}')">
      <div class="ch" onclick="sel('stage','${s.id}')"><span class="t">${esc(s.title)}</span><span class="mono muted">${s.modules.length}</span></div>
      ${s.modules.map((m) => { const shared = d.stages.filter((x) => x.modules.includes(m)).length > 1; return `<div class="mchip ${S.sel.type === 'module' && S.sel.id === m ? 'sel' : ''} ${shared ? 'shared' : ''}" title="${shared ? 'shared with other stages' : ''}" onclick="sel('module','${m}')" draggable="true" ondragstart="dragStartInternal(event,'module','${m}')"><span class="h">⠿</span>${esc(byId(d.modules, m)?.title ?? m)}</div>` }).join('')}
      <div class="gate"><span class="kicker">Gate · ${esc(s.gate)}</span>${d.artefacts.filter((a) => a.gate === s.gate).map((a) => `<div class="achip ${S.sel.type === 'artefact' && S.sel.id === a.id ? 'sel' : ''} ${S.drop === 'artefact:' + a.id ? 'drop' : ''}" onclick="sel('artefact','${a.id}')" ondragover="dragOver(event,'artefact:${a.id}')" ondragleave="dragLeave(event,'artefact:${a.id}')" ondrop="drop(event,'artefact','${a.id}')">◇ ${esc(a.title)} <span class="mono muted">${a.requires.length}</span>${hasProblem('artefact', a.id) ? '<span class="problem-dot"></span>' : ''}</div>`).join('')}</div>
    </div>`
  }).join('')
  const unused = d.modules.filter((m) => !usedIds.has(m.id))
  const unusedCol = `<div class="col unused"><div class="ch"><span class="t muted">Not in any stage</span></div>${unused.map((m) => `<div class="mchip" onclick="sel('module','${m.id}')">${esc(m.title)}</div>`).join('') || '<span class="muted">—</span>'}<div style="margin-top:8px"><button class="btn small ghost">+ Stage</button> <button class="btn small ghost">+ Module</button> <button class="btn small ghost">+ Artefact</button></div></div>`
  return toolbar() + `<div class="vc">
    <div class="map">${cols}${unusedCol}</div>
    <div class="bottom"><div class="inspector pane">${focusPane(d)}</div><div class="tray">${libraryPanel({ compact: true })}</div></div>
  </div>`
}
VariantC.title = 'Pipeline map + inspector'

const VARIANTS = { a: VariantA, b: VariantB, c: VariantC }

// ------------------------------------------------------------------ interactions
window.sel = (type, id) => { S.sel = { type, id }; S.openField = null; if (type === 'module') S.openModules.add(id); render() }
window.selField = (m, f) => { S.sel = { type: 'field', id: m + '.' + f }; S.openField = m + '.' + f; render() }
window.togField = (m, f) => { const k = m + '.' + f; S.openField = S.openField === k ? null : k; render() }
window.togModule = (id) => { S.openModules.has(id) ? S.openModules.delete(id) : S.openModules.add(id); render() }
window.tog = (path) => { const [a, b] = path.split('.'); if (b) S[a][b] = !S[a][b]; else S[a] = !S[a]; render() }
window.pickDef = (id, v) => { const d = HOMES.flatMap((h) => h.defs).find((x) => x.id === id && x.version === v); S.def = clone(d); S.sel = { type: 'stage', id: d.stages[0].id }; S.ddOpen = false; S.libSource = id === 'procurement' ? 'design' : 'procurement'; render() }
window.openLib = () => { S.libOpen = true; render() }
window.addNew = (key) => alert(`+ New ${key.slice(0, -1)} (not wired). The picker also offers "From another definition…".`)

// drag and drop (visual + in-memory append)
let DRAG = null
window.dragStartLib = (e, kind, id) => { DRAG = { source: 'lib', kind, id }; e.dataTransfer.effectAllowed = 'copy'; e.stopPropagation() }
window.dragStartInternal = (e, kind, id) => { DRAG = { source: 'self', kind, id }; e.dataTransfer.effectAllowed = 'move'; e.stopPropagation() }
window.dragOver = (e, key) => { if (!DRAG) return; e.preventDefault(); e.stopPropagation(); if (S.drop !== key) { S.drop = key; render() } }
window.dragLeave = (e, key) => { if (S.drop === key) { S.drop = null; render() } }
window.drop = (e, targetType, targetId) => {
  e.preventDefault(); e.stopPropagation(); S.drop = null
  if (!DRAG) return render()
  const d = S.def, src = libDef()
  const prov = { definition: src.id, version: src.version }
  const { kind, id } = DRAG
  const ensureModule = (mid) => { if (!byId(d.modules, mid) && byId(src.modules, mid)) { const m = clone(byId(src.modules, mid)); m.copiedFrom = { ...prov, element: 'module:' + mid }; d.modules.push(m); return true } return false }
  if (DRAG.source === 'lib') {
    if (targetType === 'stage' && kind === 'module') { if (!byId(d.modules, id)) { if (!confirm(`Copy module "${id}" from ${src.title} v${src.version} and add it to this stage?`)) return render(); ensureModule(id) } const s = byId(d.stages, targetId); if (!s.modules.includes(id)) s.modules.push(id) }
    else if (targetType === 'stage' && kind === 'stage') { if (byId(d.stages, id)) { alert(`Stage "${id}" already exists — rename / replace / merge prompt (see the copy-model prototype)`); return render() } const st = clone(byId(src.stages, id)); const missing = st.modules.filter((m) => !byId(d.modules, m)); if (!confirm(`Copy stage "${st.title}"?\nComes along: ${missing.length ? missing.join(', ') : 'nothing'}`)) return render(); missing.forEach(ensureModule); st.copiedFrom = { ...prov, element: 'stage:' + id }; d.stages.push(st); S.sel = { type: 'stage', id } }
    else if (targetType === 'artefact' && (kind === 'field' || kind === 'module')) { const a = byId(d.artefacts, targetId); const mid = id.split('.')[0]; if (ensureModule(mid)) { /* brought along */ } if (kind === 'module') { for (const f of byId(d.modules, mid).fields) if (!a.requires.includes(mid + '.' + f.id)) a.requires.push(mid + '.' + f.id) } else if (!a.requires.includes(id)) a.requires.push(id) }
    else if (targetType === 'artefact' && kind === 'artefact') { if (byId(d.artefacts, id)) { alert(`Artefact "${id}" already exists — rename / replace prompt`); return render() } const a = clone(byId(src.artefacts, id)); const mods = [...new Set(a.requires.map((r) => r.replace(/\?$/, '').split('.')[0]))].filter((m) => !byId(d.modules, m)); if (!confirm(`Copy artefact "${a.title}"?\nComes along: ${a.template} + reference docx${mods.length ? ', modules ' + mods.join(', ') : ''}`)) return render(); mods.forEach(ensureModule); a.copiedFrom = { ...prov, element: 'artefact:' + id }; d.artefacts.push(a); S.sel = { type: 'artefact', id } }
    else if (targetType === 'module' && kind === 'field') { const [sm, sf] = id.split('.'); const tm = byId(d.modules, targetId); if (byId(tm.fields, sf)) { alert(`Field "${sf}" already exists in ${tm.title} — rename / replace prompt`); return render() } const f = clone(byId(byId(src.modules, sm).fields, sf)); f.copiedFrom = { ...prov, element: `field:${sm}.${sf}` }; tm.fields.push(f); S.openField = tm.id + '.' + sf }
    else if (targetType === 'module' && kind === 'module') { if (byId(d.modules, id)) { alert(`Module "${id}" already exists — rename / replace / merge prompt`); return render() } ensureModule(id); S.sel = { type: 'module', id } }
    else alert(`A ${kind} can't be dropped on a ${targetType}.`)
  } else {
    // internal: module onto stage/artefact, field between modules
    if (kind === 'module' && targetType === 'stage') { const s = byId(d.stages, targetId); if (!s.modules.includes(id)) s.modules.push(id) }
    else if (kind === 'module' && targetType === 'artefact') { const a = byId(d.artefacts, targetId); for (const f of byId(d.modules, id).fields) if (!a.requires.includes(id + '.' + f.id)) a.requires.push(id + '.' + f.id) }
    else if (kind === 'module' && targetType === 'module') { /* reorder: no-op in prototype */ }
    else alert(`Internal drag: ${kind} → ${targetType} (reorder/move not wired in this prototype)`)
  }
  DRAG = null; render()
}
document.addEventListener('dragend', () => { DRAG = null; if (S.drop) { S.drop = null; render() } })
document.addEventListener('click', (e) => { if (S.ddOpen && !e.target.closest('.dd')) { S.ddOpen = false; render() } })

// ------------------------------------------------------------------ switcher + render
const keys = Object.keys(VARIANTS)
function currentVariant() { const v = new URLSearchParams(location.search).get('variant'); return keys.includes(v) ? v : 'a' }
function setVariant(v) { const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); render() }
document.getElementById('prev').onclick = () => setVariant(keys[(keys.indexOf(currentVariant()) + keys.length - 1) % keys.length])
document.getElementById('next').onclick = () => setVariant(keys[(keys.indexOf(currentVariant()) + 1) % keys.length])
document.addEventListener('keydown', (e) => { if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.isContentEditable) return; if (e.key === 'ArrowLeft') document.getElementById('prev').click(); if (e.key === 'ArrowRight') document.getElementById('next').click() })

function render() {
  const v = currentVariant()
  document.getElementById('root').innerHTML = VARIANTS[v]()
  document.getElementById('vlabel').textContent = `${v.toUpperCase()} · ${VARIANTS[v].title}`
}
render()
</script>
</body>
</html>
